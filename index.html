<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civil Work Daily Report V4.0</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        .header { background: white; padding: 20px 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .header h1 { color: #1a237e; font-size: 24px; }
        .header-right { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-info span { font-weight: 500; color: #1a237e; }
        .btn-logout { padding: 8px 20px; border: 1px solid #e53935; background: white; color: #e53935; border-radius: 6px; cursor: pointer; }
        .btn-logout:hover { background: #e53935; color: white; }
        .lang-toggle { display: flex; gap: 4px; background: #f0f0f0; padding: 3px; border-radius: 6px; }
        .lang-btn { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; background: transparent; transition: 0.2s; }
        .lang-btn.active { background: #4a90d9; color: white; }
        .lang-btn:hover:not(.active) { background: #ddd; }
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; background: white; padding: 5px; border-radius: 10px; flex-wrap: wrap; }
        .tab-btn { padding: 12px 24px; border: none; background: transparent; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 15px; transition: all 0.3s; }
        .tab-btn:hover { background: #f0f7ff; }
        .tab-btn.active { background: #4a90d9; color: white; }
        .tab-btn.hidden { display: none; }
        .tab-content { display: none; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .tab-content.active { display: block; }
        .sub-tabs { display: flex; gap: 5px; margin: 15px 0; flex-wrap: wrap; }
        .sub-tab-btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; background: #e8edf4; font-size: 14px; }
        .sub-tab-btn.active { background: #4a90d9; color: white; }
        .sub-tab-content { display: block; }
        .sub-tab-content.hidden { display: none; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin: 15px 0; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-weight: 500; font-size: 13px; color: #555; }
        .form-group input, .form-group select { padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; background: white; }
        .form-group input:focus, .form-group select:focus { border-color: #4a90d9; outline: none; }
        .form-group input:disabled { background: #f5f5f5; color: #999; }
        .btn { padding: 10px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; font-size: 14px; }
        .btn-primary { background: #4a90d9; color: white; }
        .btn-primary:hover { background: #357abd; }
        .btn-success { background: #4caf50; color: white; }
        .btn-success:hover { background: #388e3c; }
        .btn-danger { background: #e53935; color: white; }
        .btn-danger:hover { background: #c62828; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-secondary:hover { background: #d0d0d0; }
        .btn-warning { background: #ff9800; color: white; }
        .btn-warning:hover { background: #f57c00; }
        .btn-sm { padding: 5px 12px; font-size: 12px; }
        .table-container { overflow-x: auto; max-height: 500px; overflow-y: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        table thead { position: sticky; top: 0; z-index: 10; }
        table th { background: #4a90d9; color: white; padding: 10px 14px; text-align: left; white-space: nowrap; }
        table td { padding: 8px 14px; border-bottom: 1px solid #e8edf4; }
        table tbody tr:hover td { background-color: #f0f7ff; }
        table .row-matched { background: #e8f5e9; }
        table .row-unmatched { background: #ffebee; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin: 20px 0; }
        .stat-card { background: white; padding: 15px 20px; border-radius: 8px; border-left: 4px solid #4a90d9; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
        .stat-number { font-size: 28px; font-weight: 700; color: #1a237e; }
        .stat-label { font-size: 13px; color: #666; margin-top: 4px; }
        .pending-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; border-bottom: 1px solid #f0f0f0; }
        .pending-item:hover { background: #f8faff; }
        .pending-item .info { flex: 1; }
        .pending-item .actions { display: flex; gap: 8px; }
        .login-box { max-width: 420px; margin: 80px auto; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
        .login-box h2 { text-align: center; color: #1a237e; margin-bottom: 5px; font-size: 28px; }
        .login-box .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 30px; }
        .login-box input { width: 100%; padding: 12px 16px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .login-box input:focus { border-color: #4a90d9; outline: none; }
        .login-box .btn { width: 100%; padding: 12px; font-size: 16px; margin-top: 10px; }
        .login-message { text-align: center; margin-top: 10px; font-size: 14px; min-height: 24px; }
        .login-lang { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .login-lang button { padding: 6px 20px; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; background: white; }
        .login-lang button.active { background: #4a90d9; color: white; border-color: #4a90d9; }
        .loading { display: none; text-align: center; padding: 20px; }
        .loading.show { display: block; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #4a90d9; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 24px; background: #323232; color: white; border-radius: 8px; z-index: 9999; animation: fadeIn 0.3s; max-width: 400px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .att-input { width: 60px; padding: 5px 8px; border: 1px solid #ddd; border-radius: 4px; text-align: center; }
        .att-input:focus { border-color: #4a90d9; outline: none; }
        .att-input-wide { width: 120px; }
        .danger-zone { border: 2px solid #ffcdd2; border-radius: 8px; padding: 20px; margin-top: 15px; background: #fff5f5; }
        .danger-zone h3 { color: #c62828; }
        .section-divider { border: none; border-top: 2px solid #e8edf4; margin: 25px 0; }
        .user-role-badge { display: inline-block; padding: 2px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .user-role-badge.admin { background: #e8f5e9; color: #2e7d32; }
        .user-role-badge.viewer { background: #e3f2fd; color: #1565c0; }
        .user-role-badge.entry { background: #fff3e0; color: #e65100; }
        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .tabs { flex-wrap: wrap; }
            .tab-btn { flex: 1; text-align: center; padding: 10px; font-size: 13px; }
            .header { flex-direction: column; align-items: stretch; text-align: center; }
            .header-right { justify-content: center; }
            .user-info { justify-content: center; }
            .login-box { margin: 40px 20px; padding: 30px 20px; }
            .stats { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<!-- ===== 登录界面 ===== -->
<div id="loginPage">
    <div class="login-box">
        <h2 id="loginTitle">施工日报填报系统</h2>
        <p id="loginSubtitle" class="subtitle">Marsa LNG Project · Civil Department</p>
        <div class="login-lang">
            <button id="loginLangZh" class="active" onclick="setLoginLang('zh')">中文</button>
            <button id="loginLangEn" onclick="setLoginLang('en')">English</button>
        </div>
        <input type="text" id="loginUsername" placeholder="用户名">
        <input type="password" id="loginPassword" placeholder="密码">
        <button class="btn btn-primary" onclick="handleLogin()">登录</button>
        <div id="loginMessage" class="login-message"></div>
    </div>
</div>

<!-- ===== 主界面 ===== -->
<div id="mainApp" style="display:none;">
    <div class="container">
        <div class="header">
            <h1 id="appTitle">施工日报填报系统</h1>
            <div class="header-right">
                <div class="lang-toggle">
                    <button class="lang-btn active" onclick="setLang('zh')">中文</button>
                    <button class="lang-btn" onclick="setLang('en')">EN</button>
                </div>
                <div class="user-info">
                    <span id="userDisplayName">👤 用户</span>
                    <span id="userRoleBadge" class="user-role-badge"></span>
                    <button class="btn-logout" onclick="handleLogout()">退出</button>
                </div>
            </div>
        </div>

        <!-- Tab 导航栏 -->
        <div class="tabs" id="tabHeaders">
            <button class="tab-btn active" onclick="switchTab('entry')" data-tab="entry" data-role="entry,admin" data-i18n="tabEntry">📝 录入</button>
            <button class="tab-btn" onclick="switchTab('overview')" data-tab="overview" data-role="viewer,admin" data-i18n="tabOverview">📊 数据总览</button>
            <button class="tab-btn" onclick="switchTab('settings')" data-tab="settings" data-role="admin" data-i18n="tabSettings">⚙️ 设置</button>
        </div>

        <!-- ===== Tab: 录入 ===== -->
        <div id="tab-entry" class="tab-content active">
            <div class="sub-tabs">
                <button class="sub-tab-btn active" onclick="switchSubTab('attendance_team')" data-subtab="attendance_team">👷 班组出勤</button>
                <button class="sub-tab-btn" onclick="switchSubTab('attendance_area')" data-subtab="attendance_area">📍 区域出勤</button>
                <button class="sub-tab-btn" onclick="switchSubTab('entry_sub')" data-subtab="entry_sub">📝 施工员录入</button>
                <button class="sub-tab-btn" onclick="switchSubTab('verify_sub')" data-subtab="verify_sub">✅ 核对结果</button>
            </div>

            <!-- ===== 子Tab: 班组出勤 ===== -->
            <div id="subtab-attendance_team" class="sub-tab-content">
                <h3>👷 班组出勤</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>📅 日期</label>
                        <input type="date" id="attTeamDate">
                    </div>
                    <div class="form-group">
                        <label>👷 班组</label>
                        <select id="attTeamSelect">
                            <option value="马玉奇(Ma Yuqi)">马玉奇</option>
                            <option value="王建(Wang Jian)">王建</option>
                            <option value="Kumar">Kumar</option>
                            <option value="郭传海(Guo Chuanhai)">郭传海</option>
                            <option value="曹桂龙(Cao Guilong)">曹桂龙</option>
                            <option value="陈传军(Chen Chuanjun)">陈传军</option>
                            <option value="王世杰(Wang Shijie)">王世杰</option>
                            <option value="Sheharyar">Sheharyar</option>
                            <option value="Anwar">Anwar</option>
                        </select>
                    </div>
                    <div class="form-group" style="justify-content:flex-end;">
                        <button class="btn btn-secondary" onclick="loadTeamAttendance()">🔄 刷新</button>
                    </div>
                </div>
                <div id="teamAttendanceTable"></div>
                <button class="btn btn-primary" onclick="saveTeamAttendance()" style="margin-top:15px;">✅ 提交班组出勤</button>
            </div>

            <!-- ===== 子Tab: 区域出勤 ===== -->
            <div id="subtab-attendance_area" class="sub-tab-content hidden">
                <h3>📍 区域出勤</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>📅 日期</label>
                        <input type="date" id="attAreaDate">
                    </div>
                    <div class="form-group">
                        <label>👷 选择班组</label>
                        <select id="attAreaTeamSelect">
                            <option value="马玉奇(Ma Yuqi)">马玉奇</option>
                            <option value="王建(Wang Jian)">王建</option>
                            <option value="Kumar">Kumar</option>
                            <option value="郭传海(Guo Chuanhai)">郭传海</option>
                            <option value="曹桂龙(Cao Guilong)">曹桂龙</option>
                            <option value="陈传军(Chen Chuanjun)">陈传军</option>
                            <option value="王世杰(Wang Shijie)">王世杰</option>
                            <option value="Sheharyar">Sheharyar</option>
                            <option value="Anwar">Anwar</option>
                        </select>
                    </div>
                    <div class="form-group" style="justify-content:flex-end;">
                        <button class="btn btn-secondary" onclick="loadAreaAttendance()">🔄 刷新</button>
                    </div>
                </div>
                <div id="areaAttendanceTable"></div>
                <button class="btn btn-primary" onclick="saveAreaAttendance()" style="margin-top:15px;">✅ 提交区域出勤分配</button>
            </div>

            <!-- ===== 子Tab: 施工员录入 ===== -->
            <div id="subtab-entry_sub" class="sub-tab-content hidden">
                <!-- 保持原来的施工员录入内容不变 -->
                <h3 data-i18n="entryTitle">📝 施工员录入</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label data-i18n="date">📅 日期</label>
                        <input type="date" id="entryDate">
                    </div>
                    <div class="form-group">
                        <label data-i18n="area">📍 区域</label>
                        <select id="entryArea">
                            <option value="110">110</option>
                            <option value="210">210</option>
                            <option value="220">220</option>
                            <option value="240">240</option>
                            <option value="320">320</option>
                            <option value="330">330</option>
                            <option value="400">400</option>
                            <option value="800">800</option>
                            <option value="precast yard 1">precast yard 1</option>
                            <option value="precast yard 2">precast yard 2</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="team">👷 班组</label>
                        <select id="entryTeam">
                            <option value="马玉奇(Ma Yuqi)">马玉奇</option>
                            <option value="王建(Wang Jian)">王建</option>
                            <option value="Kumar">Kumar</option>
                            <option value="郭传海(Guo Chuanhai)">郭传海</option>
                            <option value="曹桂龙(Cao Guilong)">曹桂龙</option>
                            <option value="陈传军(Chen Chuanjun)">陈传军</option>
                            <option value="王世杰(Wang Shijie)">王世杰</option>
                            <option value="Sheharyar">Sheharyar</option>
                            <option value="Anwar">Anwar</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>🏷️ 位号</label>
                        <input type="text" id="entryTag" placeholder="输入位号">
                    </div>
                </div>

                <div style="font-weight:600;font-size:15px;color:#1a237e;margin-top:15px;" data-i18n="work_desc">🛠️ 工作内容</div>
                <div class="form-row">
                    <div class="form-group">
                        <label data-i18n="sub_item">分部分项</label>
                        <select id="entryCategory" onchange="onCategoryChange()"></select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="work_content">工作内容</label>
                        <select id="entrySubItem" onchange="onSubItemChange()"></select>
                    </div>
                    <div class="form-group">
                        <label data-i18n="code">编号</label>
                        <input type="text" id="entryCode" disabled>
                    </div>
                    <div class="form-group">
                        <label data-i18n="unit">单位</label>
                        <input type="text" id="entryUnit" disabled>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label data-i18n="qty">📊 完成量</label>
                        <input type="number" id="entryQty" value="0" step="0.1">
                    </div>
                    <div class="form-group">
                        <label data-i18n="pipe_length">📏 地管长度 (m)</label>
                        <input type="number" id="entryPipe" value="0" step="0.1">
                    </div>
                    <div class="form-group">
                        <label data-i18n="manpower">👷 人数</label>
                        <input type="number" id="entryManpower" value="0">
                    </div>
                    <div class="form-group">
                        <label data-i18n="manhours">⏱️ 工时</label>
                        <input type="number" id="entryManhours" value="0" step="0.5">
                    </div>
                    <div class="form-group">
                        <label data-i18n="non_chinese">🌍 外籍</label>
                        <input type="number" id="entryForeign" value="0">
                    </div>
                    <div class="form-group">
                        <label data-i18n="remark">📝 备注</label>
                        <input type="text" id="entryRemark" placeholder="备注">
                    </div>
                </div>

                <div style="display:flex; gap:10px; margin-top:15px; flex-wrap:wrap;">
                    <button class="btn btn-primary" onclick="addToPending()" data-i18n="add_btn">➕ 添加到待提交列表</button>
                    <button class="btn btn-secondary" onclick="addNoWork()" data-i18n="no_work_btn">🚫 今日无作业</button>
                </div>

                <div id="pendingList" style="margin-top:30px;">
                    <h3 data-i18n="pending_title">📋 待提交列表 (<span id="pendingCount">0</span> 项)</h3>
                    <div id="pendingItems"></div>
                    <div style="display:flex; gap:10px; margin-top:10px; flex-wrap:wrap;">
                        <button class="btn btn-success" onclick="submitAll()" data-i18n="submit_btn">🚀 提交所有记录</button>
                        <button class="btn btn-danger" onclick="clearPending()" data-i18n="clear_pending">🗑️ 清空列表</button>
                    </div>
                </div>
            </div>

            <!-- ===== 子Tab: 核对结果 ===== -->
            <div id="subtab-verify_sub" class="sub-tab-content hidden">
                <h3 data-i18n="verifyTitle">✅ 工时与出勤核对</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label data-i18n="date">📅 日期</label>
                        <input type="date" id="verifyDate">
                    </div>
                    <div class="form-group">
                        <label data-i18n="team">👷 班组</label>
                        <select id="verifyTeam">
                            <option value="all">全部</option>
                            <option value="马玉奇(Ma Yuqi)">马玉奇</option>
                            <option value="王建(Wang Jian)">王建</option>
                            <option value="Kumar">Kumar</option>
                            <option value="郭传海(Guo Chuanhai)">郭传海</option>
                            <option value="曹桂龙(Cao Guilong)">曹桂龙</option>
                            <option value="陈传军(Chen Chuanjun)">陈传军</option>
                            <option value="王世杰(Wang Shijie)">王世杰</option>
                            <option value="Sheharyar">Sheharyar</option>
                            <option value="Anwar">Anwar</option>
                        </select>
                    </div>
                    <div class="form-group" style="justify-content:flex-end;">
                        <button class="btn btn-secondary" onclick="loadVerification()" data-i18n="query">🔍 查询</button>
                    </div>
                </div>
                <div id="verifyResult" style="margin-top:15px;"></div>
                <div id="verifyStats" style="margin-top:15px;"></div>
            </div>
        </div>

        <!-- ===== Tab: 总览 ===== -->
        <div id="tab-overview" class="tab-content">
            <h2 data-i18n="overviewTitle">📊 数据总览</h2>
            <div class="form-row">
                <div class="form-group"><label data-i18n="date">📅 选择日期</label><input type="date" id="overviewDate"></div>
                <div class="form-group" style="justify-content:flex-end; flex-direction:row; gap:10px; flex-wrap:wrap;">
                    <button class="btn btn-secondary" onclick="loadOverview()" data-i18n="refresh">🔄 刷新</button>
                    <button class="btn btn-secondary" onclick="exportData()" data-i18n="export_title">📥 导出CSV</button>
                    <button class="btn btn-secondary" onclick="exportAllData()" data-i18n="export_title">📥 导出全部</button>
                </div>
            </div>
            <h4 data-i18n="h_status">📊 各区域填报状态</h4>
            <div id="areaStatus" style="display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;"></div>
            <h4 data-i18n="h_data">📋 当日数据</h4>
            <div id="overviewTable" class="table-container"></div>
            <hr class="section-divider">
            <h4 data-i18n="h_data">📋 全部数据</h4>
            <div id="allDataTable" class="table-container"></div>
            <div id="attendanceSummaryOverview" style="margin-top:20px;"></div>
        </div>

        <!-- ===== Tab: 设置 ===== -->
        <div id="tab-settings" class="tab-content">
            <h2 data-i18n="settingsTitle">⚙️ 设置</h2>
            <h3 data-i18n="user_management">👥 用户管理</h3>
            <div id="userList"></div>
            <hr class="section-divider">
            <h3 data-i18n="add_user">➕ 添加用户</h3>
            <div class="form-row">
                <div class="form-group"><label data-i18n="username">用户名</label><input type="text" id="newUsername" placeholder="用户名"></div>
                <div class="form-group"><label data-i18n="password">密码</label><input type="text" id="newPassword" placeholder="密码"></div>
                <div class="form-group"><label>显示名称</label><input type="text" id="newDisplayName" placeholder="显示名称"></div>
                <div class="form-group"><label>角色</label>
                    <select id="newRole">
                        <option value="admin">admin</option>
                        <option value="viewer">viewer</option>
                        <option value="entry">entry</option>
                    </select>

function renderTeamAttendance(data, tableId) {
    const container = document.getElementById(tableId);
    const map = {};

        const foreignPresent = row.ForeignPresent || row.Foreign || 0;
        const chineseExpected = row.ChineseExpected || row.Chinese || 0;
        const chinesePresent = row.ChinesePresent || row.Chinese || 0;
        const totalExpected = foreignExpected + chineseExpected;
        const totalPresent = foreignPresent + chinesePresent;
        const absent = totalExpected - totalPresent;

        totalForeignExpected += foreignExpected;
        totalForeignPresent += foreignPresent;
        totalChineseExpected += chineseExpected;
        totalChinesePresent += chinesePresent;
        totalAllExpected += totalExpected;

    const totalAbsent = totalAllExpected - totalAllPresent;
    html += `<tr style="font-weight:bold;background:#f5f5f5;">
        <td>合计</td>
        <td>${totalForeignExpected}</td><td>${totalForeignPresent}</td>
        <td>${totalChineseExpected}</td><td>${totalChinesePresent}</td>

        <td></td>

    html += '</tbody></table>';
    container.innerHTML = html;
}

async function saveTeamAttendance() {
    const date = document.getElementById('attTeamDate').value;
    const team = document.getElementById('attTeamSelect').value;
    if (!date || !team) { showToast('❌ 请选择日期和班组'); return; }

    const records = [];
    document.querySelectorAll('#teamAttendanceTable .att-input[data-field="foreignExpected"]').forEach(inp => {
        const type = inp.dataset.type;
        const foreignExpected = parseInt(inp.value) || 0;
        const foreignPresent = parseInt(document.querySelector(`#teamAttendanceTable .att-input[data-type="${type}"][data-field="foreignPresent"]`)?.value) || 0;
        const chineseExpected = parseInt(document.querySelector(`#teamAttendanceTable .att-input[data-type="${type}"][data-field="chineseExpected"]`)?.value) || 0;
        const chinesePresent = parseInt(document.querySelector(`#teamAttendanceTable .att-input[data-type="${type}"][data-field="chinesePresent"]`)?.value) || 0;
        const remark = document.querySelector(`#teamAttendanceTable .att-input[data-type="${type}"][data-field="remark"]`)?.value || '';
        const total = foreignExpected + chineseExpected;
        const present = foreignPresent + chinesePresent;
        if (total > 0 || present > 0) {
            records.push({
                Date: date,
                Team: team,
                WorkerType: type,
                Total: total,
                Present: present,
                Absent: total - present,
                ForeignExpected: foreignExpected,
                ForeignPresent: foreignPresent,
                ChineseExpected: chineseExpected,
                ChinesePresent: chinesePresent,
                Foreign: foreignExpected,
                Chinese: chineseExpected,
                Remark: remark,
                ReportedBy: currentUser || 'unknown'
            });
        }
    });

    if (records.length === 0) { showToast('❌ 请至少填报一个工种'); return; }

    try {
        for (const record of records) await addAttendance(record);
        showToast('✅ 班组出勤提交成功！');
        loadTeamAttendance();
        loadAreaAttendance();
        loadVerification();
    } catch(e) { showToast('❌ 保存失败: ' + e.message); }
}

const AREA_LIST = ['110', '210', '220', '240', '320', '330', '400', '800', 'PC1', 'PC2'];

async function loadAreaAttendance() {
    const date = document.getElementById('attAreaDate').value;
    const team = document.getElementById('attAreaTeamSelect').value;
    if (!date || !team) {
        showToast('请选择日期和班组');
        return;
    }
    try {
        // 从班组出勤获取该班组的实到人数
        const attendance = await getAttendance(date, team);
        renderAreaAttendance(attendance, 'areaAttendanceTable', team);
    } catch(e) {
        renderAreaAttendance([], 'areaAttendanceTable', team);
    }
}

function renderAreaAttendance(data, tableId, team) {
    const container = document.getElementById(tableId);
    const map = {};
    data.forEach(d => map[d.WorkerType] = d);

    // 从 localStorage 读取已保存的区域分配数据
    const savedKey = `area_distribution_${document.getElementById('attAreaDate').value}_${team}`;
    const savedData = JSON.parse(localStorage.getItem(savedKey) || '{}');

    let html = `<div style="margin-bottom:10px;font-size:13px;color:#666;">
        <strong>👷 ${team}</strong> 各工种实到人数分配
    </div>`;
    html += `<table><thead><tr>
        <th style="min-width:60px;">序号</th>
        <th style="min-width:80px;">工种</th>
        <th style="min-width:60px;">实到</th>
        <th style="min-width:60px;">110</th>
        <th style="min-width:60px;">210</th>
        <th style="min-width:60px;">220</th>
        <th style="min-width:60px;">240</th>
        <th style="min-width:60px;">320</th>
        <th style="min-width:60px;">330</th>
        <th style="min-width:60px;">400</th>
        <th style="min-width:60px;">800</th>
        <th style="min-width:60px;">PC1</th>
        <th style="min-width:60px;">PC2</th>
        <th style="min-width:60px;">合计</th>
        <th style="min-width:60px;">差值</th>
    </tr></thead><tbody>`;

    let grandTotal = 0;
    let grandDistributed = 0;
    let rowIndex = 0;

    WORKER_TYPES_ATT.forEach(type => {
        const row = map[type] || { Total: 0, Present: 0, Foreign: 0, Chinese: 0, ChinesePresent: 0, Remark: '' };
        // 实到人数 = 中国实到 + 外籍实到
        const present = (row.ChinesePresent || row.Chinese || 0) + (row.ForeignPresent || row.Foreign || 0);
        const total = row.Total || 0;
        
        // 如果实到为0，跳过
        if (present === 0 && total === 0) return;

        rowIndex++;
        const rowKey = `${type}`;
        const savedRow = savedData[rowKey] || {};
        
        // 计算各区域分配值
        let rowTotal = 0;
        let areaValues = {};
        AREA_LIST.forEach(area => {
            const val = parseInt(savedRow[area]) || 0;
            areaValues[area] = val;
            rowTotal += val;
        });
        
        const diff = present - rowTotal;

        grandTotal += present;
        grandDistributed += rowTotal;

        html += `<tr>
            <td>${rowIndex}</td>
            <td><strong>${type}</strong></td>
            <td style="font-weight:bold;color:#1565c0;">${present}</td>`;
        
        AREA_LIST.forEach(area => {
            html += `<td><input type="number" class="att-input area-input" 
                data-type="${type}" data-area="${area}" 
                value="${areaValues[area] || 0}" 
                min="0" style="width:50px;" 
                onchange="updateAreaTotal(this)"></td>`;
        });
        
        html += `<td style="font-weight:bold;color:#1565c0;" class="row-total-${type}">${rowTotal}</td>
            <td style="color:${diff !== 0 ? '#c62828' : '#4caf50'};font-weight:bold;" class="row-diff-${type}">${diff}</td>
        </tr>`;
    });

    // 合计行
    const totalDiff = grandTotal - grandDistributed;
    html += `<tr style="font-weight:bold;background:#f5f5f5;">
        <td colspan="3">合计</td>`;
    AREA_LIST.forEach(area => {
        html += `<td id="area-total-${area}">0</td>`;
    });
    html += `<td style="color:#1565c0;" id="grand-distributed">${grandDistributed}</td>
        <td style="color:${totalDiff !== 0 ? '#c62828' : '#4caf50'}" id="grand-diff">${totalDiff}</td>
    </tr>`;

    html += '</tbody></table>';
    
    // 添加说明
    html += `<div style="margin-top:10px;font-size:12px;color:#999;">
        💡 提示：分配人数总和应等于"实到"人数。差额为0时表示分配完成。
    </div>`;
    
    container.innerHTML = html;

    // 更新各区域合计
    updateAreaTotals();
}

// 更新区域合计
function updateAreaTotals() {
    AREA_LIST.forEach(area => {
        const inputs = document.querySelectorAll(`.area-input[data-area="${area}"]`);
        let total = 0;
        inputs.forEach(inp => { total += parseInt(inp.value) || 0; });
        const el = document.getElementById(`area-total-${area}`);
        if (el) el.textContent = total;
    });
}

// 单行变化时更新
function updateAreaTotal(el) {
    const type = el.dataset.type;
    const inputs = document.querySelectorAll(`.area-input[data-type="${type}"]`);
    let rowTotal = 0;
    inputs.forEach(inp => { rowTotal += parseInt(inp.value) || 0; });
    
    const totalEl = document.querySelector(`.row-total-${type}`);
    const diffEl = document.querySelector(`.row-diff-${type}`);
    const present = parseInt(document.querySelector(`#teamAttendanceTable .att-input[data-type="${type}"][data-field="chinesePresent"]`)?.value) || 0;
    const foreignPresent = parseInt(document.querySelector(`#teamAttendanceTable .att-input[data-type="${type}"][data-field="foreignPresent"]`)?.value) || 0;
    const totalPresent = present + foreignPresent;
    
    if (totalEl) totalEl.textContent = rowTotal;
    if (diffEl) {
        const diff = totalPresent - rowTotal;
        diffEl.textContent = diff;
        diffEl.style.color = diff !== 0 ? '#c62828' : '#4caf50';
    }
    
    // 更新各区域合计
    updateAreaTotals();
    
    // 更新总计
    updateGrandTotals();
}

// 更新总计
function updateGrandTotals() {
    let grandDistributed = 0;
    AREA_LIST.forEach(area => {
        const inputs = document.querySelectorAll(`.area-input[data-area="${area}"]`);
        let total = 0;
        inputs.forEach(inp => { total += parseInt(inp.value) || 0; });
        grandDistributed += total;
    });
    
    // 计算总实到
    let grandTotal = 0;
    WORKER_TYPES_ATT.forEach(type => {
        const present = parseInt(document.querySelector(`#teamAttendanceTable .att-input[data-type="${type}"][data-field="chinesePresent"]`)?.value) || 0;
        const foreignPresent = parseInt(document.querySelector(`#teamAttendanceTable .att-input[data-type="${type}"][data-field="foreignPresent"]`)?.value) || 0;
        grandTotal += (present + foreignPresent);
    });
    
    const grandDistributedEl = document.getElementById('grand-distributed');
    const grandDiffEl = document.getElementById('grand-diff');
    if (grandDistributedEl) grandDistributedEl.textContent = grandDistributed;
    if (grandDiffEl) {
        const diff = grandTotal - grandDistributed;
        grandDiffEl.textContent = diff;
        grandDiffEl.style.color = diff !== 0 ? '#c62828' : '#4caf50';
    }
}

async function saveAreaAttendance() {
    const date = document.getElementById('attAreaDate').value;
    const team = document.getElementById('attAreaTeamSelect').value;
    if (!date || !team) { showToast('❌ 请选择日期和班组'); return; }

    const savedKey = `area_distribution_${date}_${team}`;
    const distribution = {};
    
    document.querySelectorAll('.area-input').forEach(inp => {
        const type = inp.dataset.type;
        const area = inp.dataset.area;

        if (!distribution[type]) distribution[type] = {};
        distribution[type][area] = val;
    });

    localStorage.setItem(savedKey, JSON.stringify(distribution));
    showToast('✅ 区域分配已保存！');
    loadAreaAttendance();
}

async function apiFetch(path, options = {}) {
    try {
        const res = await fetch(path, {
            ...options,
            headers: { 'Content-Type': 'application/json', ...options.headers }
        });
        if (!res.ok) {
            const text = await res.text();
            throw new Error(text || '请求失败');
        }
        return res.json();
    } catch (err) {
        console.error('API错误:', err);
        throw err;
    }
}

function handleLogin() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    const msg = document.getElementById('loginMessage');

    if (!username || !password) {
        msg.textContent = '❌ 请输入用户名和密码';
        msg.style.color = 'red';
        return;
    }

    const user = USERS[username];
    if (!user) {
        msg.textContent = '❌ 用户不存在';
        msg.style.color = 'red';
        return;
    }

    if (user.password !== password) {
        msg.textContent = '❌ 密码错误';
        msg.style.color = 'red';
        return;
    }

    currentUser = username;
    currentRole = user.role;
    isAdmin = currentRole === 'admin';

    document.getElementById('userDisplayName').textContent = '👤 ' + user.display_name;
    const badge = document.getElementById('userRoleBadge');
    badge.textContent = currentRole;
    badge.className = 'user-role-badge ' + currentRole;

    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';

    updateTabVisibility();
    initApp();
    updateUI();
    showToast(t('loginWelcome') + user.display_name + '！');
    msg.textContent = '';
}

function handleLogout() {
    if (confirm('确定要退出吗？')) {
        currentUser = null;
        currentRole = null;
        document.getElementById('loginPage').style.display = 'block';
        document.getElementById('mainApp').style.display = 'none';
        pendingItems = [];
        document.getElementById('loginMessage').textContent = '';
    }
}

// ============================================================
//  Tab 控制
// ============================================================
function updateTabVisibility() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
        const roles = btn.dataset.role.split(',');
        if (roles.includes(currentRole)) {
            btn.classList.remove('hidden');
        } else {
            btn.classList.add('hidden');
        }
    });
}

function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
    document.getElementById(`tab-${tab}`).classList.add('active');

    if (tab === 'entry') {
        renderPending();
        loadTeamAttendance();
        loadAreaAttendance();
    }
    if (tab === 'overview') {
        loadOverview();
    }
    if (tab === 'settings') {
        loadUserList();
        loadLoginLogs();
    }
}

function switchSubTab(subtab) {
    document.querySelectorAll('.sub-tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.sub-tab-content').forEach(c => c.classList.add('hidden'));
    document.querySelector(`.sub-tab-btn[data-subtab="${subtab}"]`).classList.add('active');
    document.getElementById(`subtab-${subtab}`).classList.remove('hidden');

    if (subtab === 'attendance_team') {
        loadTeamAttendance();
    }
    if (subtab === 'attendance_area') {
        loadAreaAttendance();
    }
    if (subtab === 'entry_sub') {
        renderPending();
    }
    if (subtab === 'verify_sub') {
        loadVerification();
    }
}

// ============================================================

// ============================================================
function onCategoryChange() {
    const categorySelect = document.getElementById('entryCategory');
    const lang = currentLang || 'zh';
    if (!categorySelect) return;
    const categories = Object.keys(WORK_DICT);
    if (categories.length === 0) return;
    const catMap = {
        '无收入项': 'Non-revenue Work',
        '土石方工程': 'Earthwork',
        '模板工程': 'Formwork',
        '架子工程': 'Scaffolding',
        '钢筋工程': 'Rebar / Reinforcement',
        '砌筑工程': 'Masonry',
        '混凝土工程': 'Concrete Works'
    };
    const currentValue = categorySelect.value;
    categorySelect.innerHTML = '';
    categories.forEach((cat) => {
        const option = document.createElement('option');
        option.value = cat;
        option.textContent = lang === 'zh' ? cat : (catMap[cat] || cat);
        categorySelect.appendChild(option);
    });
    if (currentValue && categories.includes(currentValue)) {
        categorySelect.value = currentValue;
    }
    onSubItemChange();
}

function onSubItemChange() {
    const category = document.getElementById('entryCategory').value;
    const subSelect = document.getElementById('entrySubItem');
    const lang = currentLang || 'zh';
    if (!subSelect) return;
    subSelect.innerHTML = '';
    const items = WORK_DICT[category] || {};
    const keys = Object.keys(items);
    if (keys.length === 0) {
        const option = document.createElement('option');
        option.value = '';
        option.textContent = lang === 'zh' ? '无工作内容' : 'No work items';
        subSelect.appendChild(option);
        document.getElementById('entryCode').value = 'N/A';
        document.getElementById('entryUnit').value = 'N/A';
        return;
    }
    keys.forEach(key => {
        const option = document.createElement('option');
        option.value = key;
        if (lang === 'zh') {
            option.textContent = key;
        } else {
            const item = items[key];
            option.textContent = item.en || key;
        }
        subSelect.appendChild(option);
    });
    const firstKey = keys[0];
    if (firstKey) {
        const info = items[firstKey];
        document.getElementById('entryCode').value = info.code || 'N/A';
        document.getElementById('entryUnit').value = info.unit || 'N/A';
    }
}

// ============================================================
//  待提交管理
// ============================================================
function addToPending() {
    const date = document.getElementById('entryDate').value;
    const area = document.getElementById('entryArea').value;
    const team = document.getElementById('entryTeam').value;
    const tag = document.getElementById('entryTag').value || 'N/A';
    const category = document.getElementById('entryCategory').value;
    const desc = document.getElementById('entrySubItem').value;
    const code = document.getElementById('entryCode').value;
    const unit = document.getElementById('entryUnit').value;
    const qty = parseFloat(document.getElementById('entryQty').value) || 0;
    const pipeLength = parseFloat(document.getElementById('entryPipe').value) || 0;
    const manpower = parseInt(document.getElementById('entryManpower').value) || 0;
    const manhours = parseFloat(document.getElementById('entryManhours').value) || 0;
    const foreign = parseInt(document.getElementById('entryForeign').value) || 0;
    const remark = document.getElementById('entryRemark').value || '';

    if (!date || !area || !team) {
        showToast(t('errorFillAll'));
        return;
    }

    const saved = localStorage.getItem('pending_items');
    if (saved) {
        try { pendingItems = JSON.parse(saved); } catch(e) { pendingItems = []; }
    } else { pendingItems = []; }

    const duplicate = pendingItems.some(item => 
        (item.Date || item.date) === date && 
        (item.Area || item.area) === area && 
        (item.Team || item.team) === team && 
        (item.Description || item.description) === desc
    );
    if (duplicate) {
        showToast('⚠️ 已存在相同记录');
        return;
    }

    pendingItems.push({
        Date: date, Area: area, Team: team, Tag: tag,
        Code: code, Category: category, Description: desc, Unit: unit,
        Qty: qty, PipeLength: pipeLength, Manpower: manpower,
        Manhours: manhours, Foreign: foreign, Remark: remark,
        CreatedBy: currentUser || 'unknown'
    });

    localStorage.setItem('pending_items', JSON.stringify(pendingItems));
    renderPending();
    showToast('✅ 已添加到待提交列表');

    document.getElementById('entryTag').value = '';
    document.getElementById('entryQty').value = '0';
    document.getElementById('entryPipe').value = '0';
    document.getElementById('entryManpower').value = '0';
    document.getElementById('entryManhours').value = '0';
    document.getElementById('entryForeign').value = '0';
    document.getElementById('entryRemark').value = '';
}

function addNoWork() {
    const date = document.getElementById('entryDate').value;
    const area = document.getElementById('entryArea').value;
    const team = document.getElementById('entryTeam').value;
    if (!date || !area || !team) {
        showToast(t('errorFillAll'));
        return;
    }
    pendingItems.push({
        Date: date, Area: area, Team: team, Tag: 'N/A',
        Code: '0-0-000', Category: '无作业', Description: '区域 ' + area + ' 无施工',
        Unit: 'N/A', Qty: 0, PipeLength: 0, Manpower: 0,
        Manhours: 0, Foreign: 0, Remark: '无作业',
        CreatedBy: currentUser || 'unknown'
    });
    renderPending();
    localStorage.setItem('pending_items', JSON.stringify(pendingItems));
    showToast('✅ 已标记 ' + area + ' 今日无作业');
}

function renderPending() {
    const saved = localStorage.getItem('pending_items');
    if (saved) {
        try { pendingItems = JSON.parse(saved); } catch(e) { pendingItems = []; }
    } else { pendingItems = []; }
    const container = document.getElementById('pendingItems');
    const countEl = document.getElementById('pendingCount');
    if (!container) return;
    if (countEl) countEl.textContent = pendingItems.length;
    container.innerHTML = '';
    if (pendingItems.length === 0) {
        container.innerHTML = '<p style="color:#999;padding:20px;text-align:center;">' + t('noPending') + '</p>';
        return;
    }
    pendingItems.forEach((item, index) => {
        const date = item.Date || item.date || '';
        const area = item.Area || item.area || '';
        const team = item.Team || item.team || '';
        const desc = item.Description || item.description || '';
        const qty = item.Qty || item.qty || 0;
        const manpower = item.Manpower || item.manpower || 0;
        container.innerHTML += `<div class="pending-item">
            <div class="info"><strong>${date}</strong> | ${area} | ${team} | ${desc}
                <span style="color:#999;font-size:12px;margin-left:10px;">${qty > 0 ? '数量:'+qty : ''}${manpower > 0 ? '人数:'+manpower : ''}</span>
            </div>
            <div class="actions"><button class="btn btn-danger btn-sm" onclick="removePending(${index})">删除</button></div>
        </div>`;
    });
}

function removePending(index) {
    pendingItems.splice(index, 1);
    localStorage.setItem('pending_items', JSON.stringify(pendingItems));
    renderPending();
}

function clearPending() {
    if (pendingItems.length === 0) { showToast('⚠️ 列表已是空的'); return; }
    if (!confirm(t('confirmClear'))) return;
    pendingItems = [];
    localStorage.removeItem('pending_items');
    renderPending();
    showToast('🗑️ 已清空待提交列表');
}

function loadPending() {
    const saved = localStorage.getItem('pending_items');
    if (saved) {
        try { pendingItems = JSON.parse(saved); } catch(e) { pendingItems = []; }
    } else { pendingItems = []; }
    renderPending();
}

async function submitAll() {
    if (pendingItems.length === 0) { showToast('❌ 没有待提交的记录'); return; }
    if (!confirm(t('confirmSubmit').replace('{count}', pendingItems.length))) return;
    let successCount = 0;
    for (const item of pendingItems) {
        try {
            await addReport({
                Date: item.Date || item.date,
                Area: item.Area || item.area,
                Team: item.Team || item.team,
                Tag: item.Tag || item.tag || 'N/A',
                Code: item.Code || item.code || '',
                Category: item.Category || item.category || '',
                Description: item.Description || item.description || '',
                Unit: item.Unit || item.unit || '',
                Qty: item.Qty || item.qty || 0,
                PipeLength: item.PipeLength || item.pipeLength || 0,
                Manpower: item.Manpower || item.manpower || 0,
                Manhours: item.Manhours || item.manhours || 0,
                Foreign: item.Foreign || item.foreign || 0,
                Remark: item.Remark || item.remark || '',
                CreatedBy: currentUser || 'unknown'
            });
            successCount++;
        } catch(e) { console.error(e); }
    }
    pendingItems = [];
    localStorage.removeItem('pending_items');
    renderPending();
    loadOverview();
    showToast(t('successSubmit').replace('{count}', successCount));
}

// ============================================================
//  出勤日报汇总（数据总览中使用）
// ============================================================
async function loadAttendanceSummary(date) {
    const container = document.getElementById('attendanceSummaryOverview');
    if (!container) return;
    try {
        const data = await getAttendance(date);
        if (data.length === 0) {
            container.innerHTML = '<p style="color:#999;padding:10px;">该日期暂无出勤数据</p>';
            return;
        }
        const summary = {};
        data.forEach(d => {
            const type = d.WorkerType || '未知';
            if (!summary[type]) summary[type] = { Total: 0, Present: 0, Absent: 0 };
            summary[type].Total += d.Total || 0;
            summary[type].Present += d.Present || 0;
            summary[type].Absent += d.Absent || 0;
        });
        let html = `<h4>📊 出勤日报汇总 (${date})</h4><table><thead><tr><th>工种</th><th>应到</th><th>实到</th><th>缺勤</th></tr></thead><tbody>`;
        let totalT = 0, totalP = 0, totalA = 0;
        Object.keys(summary).forEach(type => {
            const s = summary[type];
            totalT += s.Total; totalP += s.Present; totalA += s.Absent;
            html += `<tr><td>${type}</td><td>${s.Total}</td><td>${s.Present}</td><td style="color:${s.Absent > 0 ? '#c62828' : '#4caf50'}">${s.Absent}</td></tr>`;
        });
        html += `<tr style="font-weight:bold;background:#f5f5f5;"><td>合计</td><td>${totalT}</td><td>${totalP}</td><td style="color:${totalA > 0 ? '#c62828' : '#4caf50'}">${totalA}</td></tr>`;
        html += '</tbody></table>';
        container.innerHTML = html;
    } catch(e) {
        container.innerHTML = '<p style="color:#999;padding:10px;">加载失败</p>';
    }
}

// ============================================================
//  数据总览
// ============================================================
async function loadOverview() {
    const date = document.getElementById('overviewDate').value;
    try {
        const data = await getReports(date);
        const filtered = data || [];
        const submittedAreas = new Set(filtered.map(d => d.Area));
        const statusHtml = AREAS.map(area => {
            const isSubmitted = submittedAreas.has(area);
            return `<span style="padding:8px 16px;border-radius:6px;background:${isSubmitted ? '#e8f5e9' : '#ffebee'};color:${isSubmitted ? '#2e7d32' : '#c62828'};border:1px solid ${isSubmitted ? '#a5d6a7' : '#ef9a9a'};">
                <strong>${area}</strong> ${isSubmitted ? '🟢 已提交' : '🔴 未提交'}
            </span>`;
        }).join('');
        document.getElementById('areaStatus').innerHTML = statusHtml;
        const table = document.getElementById('overviewTable');
        if (filtered.length === 0) {
            table.innerHTML = '<p style="color:#999;padding:20px;">' + t('noDataDate') + '</p>';
        } else {
            let html = `<p style="color:#666;margin-bottom:10px;">共 ${filtered.length} 条记录</p><table><thead><tr><th>日期</th><th>区域</th><th>班组</th><th>工作描述</th><th>完成量</th><th>人数</th><th>工时</th></tr></thead><tbody>`;
            filtered.forEach(d => {
                html += `<tr><td>${d.Date}</td><td>${d.Area}</td><td>${d.Team}</td><td>${(d.Description || '').substring(0, 30)}${(d.Description || '').length > 30 ? '...' : ''}</td>
                    <td>${d.Qty || 0}</td><td>${d.Manpower || 0}</td><td>${d.Manhours || 0}</td></tr>`;
            });
            html += '</tbody></table>';
            table.innerHTML = html;
        }
        const allTable = document.getElementById('allDataTable');
        try {
            const all = await getReports();
            if (all.length === 0) {
                allTable.innerHTML = '<p style="color:#999;padding:20px;">' + t('noData') + '</p>';
            } else {
                let html = `<p style="color:#666;margin-bottom:10px;">共 ${all.length} 条记录</p><table><thead><tr><th>日期</th><th>区域</th><th>班组</th><th>工作描述</th><th>完成量</th><th>人数</th><th>工时</th></tr></thead><tbody>`;
                all.slice(-100).reverse().forEach(d => {
                    html += `<tr><td>${d.Date}</td><td>${d.Area}</td><td>${d.Team}</td><td>${(d.Description || '').substring(0, 30)}${(d.Description || '').length > 30 ? '...' : ''}</td>
                        <td>${d.Qty || 0}</td><td>${d.Manpower || 0}</td><td>${d.Manhours || 0}</td></tr>`;
                });
                html += '</tbody></table>';
                allTable.innerHTML = html;
            }
        } catch(e) { allTable.innerHTML = '<p style="color:#999;padding:10px;">加载失败</p>'; }
        
        // 加载出勤日报汇总
        loadAttendanceSummary(date);
        
    } catch(e) {
        document.getElementById('overviewTable').innerHTML = '<p style="color:#999;padding:20px;">加载失败</p>';
    }
}

// ============================================================
//  核对结果
// ============================================================
async function loadVerification() {
    const date = document.getElementById('verifyDate').value;
    const teamFilter = document.getElementById('verifyTeam').value;
    if (!date) return;
    try {
        const attendance = await getAttendance(date);
        const reports = await getReports(date);
        const filteredTeams = teamFilter === 'all' ? TEAMS : [teamFilter];
        let html = '<table><thead><tr><th>' + t('teamCol') + '</th><th>出勤人数</th><th>工时人数</th><th>' + t('matched') + '</th><th>' + t('diff') + '</th></tr></thead><tbody>';
        let totalExpected = 0, totalManpower = 0, matchedCount = 0, teamsWithData = 0;
        filteredTeams.forEach(team => {
            const att = attendance.filter(a => a.Team === team);
            const totalAtt = att.reduce((s, a) => s + (a.Total || 0), 0);
            const rep = reports.filter(r => r.Team === team);
            const totalMp = rep.reduce((s, r) => s + (r.Manpower || 0), 0);
            const hasData = totalAtt > 0 || totalMp > 0;
            if (hasData) teamsWithData++;
            const matched = totalAtt === totalMp && totalAtt > 0;
            const diff = totalAtt - totalMp;
            if (matched && totalAtt > 0) matchedCount++;
            totalExpected += totalAtt; totalManpower += totalMp;
            html += `<tr class="${hasData ? (matched ? 'row-matched' : 'row-unmatched') : ''}">
                <td>${team}</td><td>${totalAtt}</td><td>${totalMp}</td>
                <td>${hasData ? (matched ? '✅' : '❌') : '-'}</td>
                <td style="color:${diff !== 0 && hasData ? '#c62828' : '#4caf50'}">${hasData ? diff : '-'}</td>
            </tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('verifyResult').innerHTML = html;
        document.getElementById('verifyStats').innerHTML = `<div class="stats">
            <div class="stat-card"><div class="stat-number">${totalExpected}</div><div class="stat-label">总出勤人数</div></div>
            <div class="stat-card"><div class="stat-number">${totalManpower}</div><div class="stat-label">总工时人数</div></div>
            <div class="stat-card"><div class="stat-number">${matchedCount}/${teamsWithData || 1}</div><div class="stat-label">匹配班组</div></div>
        </div>`;
    } catch(e) { document.getElementById('verifyResult').innerHTML = '<p style="color:#999;padding:20px;">加载失败</p>'; }
}
