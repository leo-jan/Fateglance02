<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>施工日报系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4f8; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        .header { background: white; padding: 20px 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .header h1 { color: #1a237e; font-size: 24px; }
        .header-right { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-info span { font-weight: 500; color: #1a237e; }
        .user-role-badge { display: inline-block; padding: 2px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        .user-role-badge.admin { background: #e8f5e9; color: #2e7d32; }
        .user-role-badge.viewer { background: #e3f2fd; color: #1565c0; }
        .user-role-badge.entry { background: #fff3e0; color: #e65100; }
        .btn-logout { padding: 8px 20px; border: 1px solid #e53935; background: white; color: #e53935; border-radius: 6px; cursor: pointer; }
        .btn-logout:hover { background: #e53935; color: white; }
        
        .lang-toggle { display: flex; gap: 4px; background: #f0f0f0; padding: 3px; border-radius: 6px; }
        .lang-btn { padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; background: transparent; transition: 0.2s; }
        .lang-btn.active { background: #4a90d9; color: white; }
        .lang-btn:hover:not(.active) { background: #ddd; }
        
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; background: white; padding: 5px; border-radius: 10px; flex-wrap: wrap; }
        .tab-btn { padding: 12px 24px; border: none; background: transparent; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 15px; transition: all 0.3s; }
        .tab-btn:hover { background: #f0f7ff; }
        .tab-btn.active { background: #4a90d9; color: white; }
        .tab-btn.hidden { display: none; }
        .tab-content { display: none; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .tab-content.active { display: block; }
        
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin: 15px 0; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-weight: 500; font-size: 13px; color: #555; }
        .form-group input, .form-group select { padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; background: white; }
        .form-group input:focus, .form-group select:focus { border-color: #4a90d9; outline: none; }
        .form-group input:disabled { background: #f5f5f5; color: #999; }
        
        .btn { padding: 10px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: #4a90d9; color: white; }
        .btn-primary:hover { background: #357abd; }
        .btn-success { background: #4caf50; color: white; }
        .btn-success:hover { background: #388e3c; }
        .btn-danger { background: #e53935; color: white; }
        .btn-danger:hover { background: #c62828; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-secondary:hover { background: #d0d0d0; }
        .btn-warning { background: #ff9800; color: white; }
        .btn-warning:hover { background: #f57c00; }
        .btn-sm { padding: 5px 12px; font-size: 12px; }
        
        .table-container { overflow-x: auto; max-height: 500px; overflow-y: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        table thead { position: sticky; top: 0; z-index: 10; }
        table th { background: #4a90d9; color: white; padding: 10px 14px; text-align: left; white-space: nowrap; }
        table td { padding: 8px 14px; border-bottom: 1px solid #e8edf4; }
        table tbody tr:hover td { background-color: #f0f7ff; }
        table .row-matched { background: #e8f5e9; }
        table .row-unmatched { background: #ffebee; }
        
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin: 20px 0; }
        .stat-card { background: white; padding: 15px 20px; border-radius: 8px; border-left: 4px solid #4a90d9; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
        .stat-number { font-size: 28px; font-weight: 700; color: #1a237e; }
        .stat-label { font-size: 13px; color: #666; margin-top: 4px; }
        
        .pending-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; border-bottom: 1px solid #f0f0f0; }
        .pending-item:hover { background: #f8faff; }
        .pending-item .info { flex: 1; }
        .pending-item .actions { display: flex; gap: 8px; }
        
        .login-box { max-width: 420px; margin: 80px auto; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
        .login-box h2 { text-align: center; color: #1a237e; margin-bottom: 5px; font-size: 28px; }
        .login-box .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 30px; }
        .login-box input { width: 100%; padding: 12px 16px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .login-box input:focus { border-color: #4a90d9; outline: none; }
        .login-box .btn { width: 100%; padding: 12px; font-size: 16px; margin-top: 10px; }
        .login-message { text-align: center; margin-top: 10px; font-size: 14px; min-height: 24px; }
        .login-lang { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .login-lang button { padding: 6px 20px; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; background: white; }
        .login-lang button.active { background: #4a90d9; color: white; border-color: #4a90d9; }
        
        .loading { display: none; text-align: center; padding: 20px; }
        .loading.show { display: block; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #4a90d9; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 24px; background: #323232; color: white; border-radius: 8px; z-index: 9999; animation: fadeIn 0.3s; max-width: 400px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .att-input { width: 60px; padding: 5px 8px; border: 1px solid #ddd; border-radius: 4px; text-align: center; }
        .att-input:focus { border-color: #4a90d9; outline: none; }
        .att-input-wide { width: 120px; }
        
        .cloud-badge { display: inline-block; background: #e3f2fd; color: #1565c0; padding: 2px 12px; border-radius: 12px; font-size: 11px; font-weight: 600; }
        
        .danger-zone { border: 2px solid #ffcdd2; border-radius: 8px; padding: 20px; margin-top: 15px; background: #fff5f5; }
        .danger-zone h3 { color: #c62828; }
        
        .section-divider { border: none; border-top: 2px solid #e8edf4; margin: 25px 0; }
        
        .role-tabs-hint { padding: 10px 16px; background: #f5f5f5; border-radius: 6px; font-size: 13px; color: #666; margin-bottom: 15px; }
        .role-tabs-hint strong { color: #1a237e; }
        
        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .tabs { flex-wrap: wrap; }
            .tab-btn { flex: 1; text-align: center; padding: 10px; font-size: 13px; }
            .header { flex-direction: column; align-items: stretch; text-align: center; }
            .header-right { justify-content: center; }
            .user-info { justify-content: center; }
            .login-box { margin: 40px 20px; padding: 30px 20px; }
            .stats { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<!-- ===== 登录界面 ===== -->
<div id="loginPage">
    <div class="login-box">
        <h2 id="loginTitle">🏗️ 施工日报填报系统</h2>
        <p id="loginSubtitle" class="subtitle">Marsa LNG Project · Civil Department</p>
        <div class="login-lang">
            <button id="loginLangZh" class="active" onclick="setLoginLang('zh')">中文</button>
            <button id="loginLangEn" onclick="setLoginLang('en')">English</button>
        </div>
        <input type="text" id="loginUsername" placeholder="用户名 / Username" value="admin">
        <input type="password" id="loginPassword" placeholder="密码 / Password" value="142857jj">
        <button class="btn btn-primary" onclick="handleLogin()">🔑 登录 / Login</button>
        <div id="loginMessage" class="login-message"></div>
        <p style="text-align:center;font-size:11px;color:#b0bec5;margin-top:16px;">☁️ 云端版 · Supabase</p>
    </div>
</div>

<!-- ===== 主界面 ===== -->
<div id="mainApp" style="display:none;">
    <div class="container">
        <div class="header">
            <h1 id="appTitle">🏗️ 施工日报填报系统 <span class="cloud-badge">☁️ 云端版</span></h1>
            <div class="header-right">
                <div class="lang-toggle">
                    <button class="lang-btn active" onclick="setLang('zh')">中文</button>
                    <button class="lang-btn" onclick="setLang('en')">EN</button>
                </div>
                <div class="user-info">
                    <span id="userDisplayName">👤 用户</span>
                    <span id="userRoleBadge" class="user-role-badge"></span>
                    <button class="btn-logout" onclick="handleLogout()">🚪 退出</button>
                </div>
            </div>
        </div>
        
        <!-- Tab 导航栏 -->
        <div class="tabs" id="tabHeaders">
            <button class="tab-btn active" onclick="switchTab('entry')" data-tab="entry" data-role="entry,admin">📝 施工量录入</button>
            <button class="tab-btn" onclick="switchTab('attendance')" data-tab="attendance" data-role="entry,admin">👷 出勤日报</button>
            <button class="tab-btn" onclick="switchTab('overview')" data-tab="overview" data-role="viewer,admin">📊 数据总览</button>
            <button class="tab-btn" onclick="switchTab('verify')" data-tab="verify" data-role="viewer,admin">✅ 工时核对</button>
            <button class="tab-btn" onclick="switchTab('settings')" data-tab="settings" data-role="admin">⚙️ 设置</button>
        </div>
        
        
        <!-- ===== Tab: 录入 ===== -->
        <div id="tab-entry" class="tab-content active">
            <h2 id="entryTitle">📝 施工量录入</h2>
            <div class="form-row">
                <div class="form-group">
                    <label id="lblDate">📅 日期</label>
                    <input type="date" id="entryDate">
                </div>
                <div class="form-group">
                    <label id="lblArea">📍 区域</label>
                    <select id="entryArea">
                        <option value="110">110</option>
                        <option value="210">210</option>
                        <option value="220">220</option>
                        <option value="240">240</option>
                        <option value="320">320</option>
                        <option value="330">330</option>
                        <option value="400">400</option>
                        <option value="800">800</option>
                        <option value="precast yard 1">precast yard 1</option>
                        <option value="precast yard 2">precast yard 2</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="lblTeam">👷 班组</label>
                    <select id="entryTeam">
                        <option value="马玉奇(Ma Yuqi)">马玉奇(Ma Yuqi)</option>
                        <option value="王建(Wang Jian)">王建(Wang Jian)</option>
                        <option value="Kumar">Kumar</option>
                        <option value="郭传海(Guo Chuanhai)">郭传海(Guo Chuanhai)</option>
                        <option value="曹桂龙(Cao Guilong)">曹桂龙(Cao Guilong)</option>
                        <option value="陈传军(Chen Chuanjun)">陈传军(Chen Chuanjun)</option>
                        <option value="王世杰(Wang Shijie)">王世杰(Wang Shijie)</option>
                        <option value="Sheharyar">Sheharyar</option>
                        <option value="Anwar">Anwar</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="lblTag">🏷️ 位号</label>
                    <input type="text" id="entryTag" placeholder="输入位号 / Tag No.">
                </div>
            </div>
            
            <div style="font-weight:600;font-size:15px;color:#1a237e;margin-top:15px;" id="workTitle">🛠️ 工作内容</div>
            <div class="form-row">
                <div class="form-group">
                    <label id="lblCategory">分部分项</label>
                    <select id="entryCategory" onchange="onCategoryChange()"></select>
                </div>
                <div class="form-group">
                    <label id="lblSubItem">工作内容</label>
                    <select id="entrySubItem" onchange="onSubItemChange()"></select>
                </div>
                <div class="form-group">
                    <label id="lblCode">编号</label>
                    <input type="text" id="entryCode" disabled>
                </div>
                <div class="form-group">
                    <label id="lblUnit">单位</label>
                    <input type="text" id="entryUnit" disabled>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label id="lblQty">📊 完成量</label>
                    <input type="number" id="entryQty" value="0" step="0.1">
                </div>
                <div class="form-group">
                    <label id="lblPipe">📏 地管长度 (m)</label>
                    <input type="number" id="entryPipe" value="0" step="0.1">
                </div>
                <div class="form-group">
                    <label id="lblManpower">👷 人数</label>
                    <input type="number" id="entryManpower" value="0">
                </div>
                <div class="form-group">
                    <label id="lblManhours">⏱️ 工时</label>
                    <input type="number" id="entryManhours" value="0" step="0.5">
                </div>
                <div class="form-group">
                    <label id="lblForeign">🌍 外籍</label>
                    <input type="number" id="entryForeign" value="0">
                </div>
                <div class="form-group">
                    <label id="lblRemark">📝 备注</label>
                    <input type="text" id="entryRemark" placeholder="备注 / Remark">
                </div>
            </div>
            
            <div style="display:flex; gap:10px; margin-top:15px; flex-wrap:wrap;">
                <button class="btn btn-primary" onclick="addToPending()" id="btnAddPending">➕ 添加到待提交列表</button>
                <button class="btn btn-secondary" onclick="addNoWork()" id="btnNoWork">🚫 今日无作业</button>
            </div>
            
            <div id="pendingList" style="margin-top:30px;">
                <h3 id="pendingTitle">📋 待提交列表 (<span id="pendingCount">0</span> 项)</h3>
                <div id="pendingItems"></div>
                <div style="display:flex; gap:10px; margin-top:10px; flex-wrap:wrap;">
                    <button class="btn btn-success" onclick="submitAll()" id="btnSubmitAll">🚀 提交所有记录</button>
                    <button class="btn btn-danger" onclick="clearPending()" id="btnClearPending">🗑️ 清空列表</button>
                </div>
            </div>
        </div>
        
        <!-- ===== Tab: 出勤 ===== -->
        <div id="tab-attendance" class="tab-content">
            <h2 id="attTitle">👷 出勤日报（班组长）</h2>
            <div class="form-row">
                <div class="form-group">
                    <label id="lblAttDate">📅 日期</label>
                    <input type="date" id="attDate">
                </div>
                <div class="form-group">
                    <label id="lblAttTeam">👷 班组</label>
                    <select id="attTeam">
                        <option value="马玉奇(Ma Yuqi)">马玉奇(Ma Yuqi)</option>
                        <option value="王建(Wang Jian)">王建(Wang Jian)</option>
                        <option value="Kumar">Kumar</option>
                        <option value="郭传海(Guo Chuanhai)">郭传海(Guo Chuanhai)</option>
                        <option value="曹桂龙(Cao Guilong)">曹桂龙(Cao Guilong)</option>
                        <option value="陈传军(Chen Chuanjun)">陈传军(Chen Chuanjun)</option>
                        <option value="王世杰(Wang Shijie)">王世杰(Wang Shijie)</option>
                        <option value="Sheharyar">Sheharyar</option>
                        <option value="Anwar">Anwar</option>
                    </select>
                </div>
                <div class="form-group" style="justify-content:flex-end;">
                    <button class="btn btn-secondary" onclick="loadAttendance()" id="btnRefreshAtt">🔄 刷新</button>
                </div>
            </div>
            <div id="attendanceTable"></div>
            <button class="btn btn-primary" onclick="saveAttendance()" style="margin-top:15px;" id="btnSaveAtt">✅ 提交考勤</button>
            <hr class="section-divider">
            <h4 id="attSummaryTitle">📊 今日报工汇总</h4>
            <div id="attendanceSummary"></div>
        </div>
        
        <!-- ===== Tab: 总览 ===== -->
        <div id="tab-overview" class="tab-content">
            <h2 id="overviewTitle">📊 数据总览</h2>
            <div class="form-row">
                <div class="form-group">
                    <label id="lblOverviewDate">📅 选择日期</label>
                    <input type="date" id="overviewDate">
                </div>
                <div class="form-group" style="justify-content:flex-end; flex-direction:row; gap:10px; flex-wrap:wrap;">
                    <button class="btn btn-secondary" onclick="loadOverview()" id="btnRefreshOverview">🔄 刷新</button>
                    <button class="btn btn-secondary" onclick="exportData()" id="btnExportOverview">📥 导出CSV</button>
                    <button class="btn btn-secondary" onclick="exportAllData()" id="btnExportAll">📥 导出全部</button>
                </div>
            </div>
            <h4 id="areaStatusTitle">📊 各区域填报状态</h4>
            <div id="areaStatus" style="display:flex;flex-wrap:wrap;gap:10px;margin:10px 0;"></div>
            <h4 id="dailyDataTitle">📋 当日数据</h4>
            <div id="overviewTable" class="table-container"></div>
            <hr class="section-divider">
            <h4 id="allDataTitle">📋 全部数据</h4>
            <div id="allDataTable" class="table-container"></div>
        </div>
        
        <!-- ===== Tab: 核对 ===== -->
        <div id="tab-verify" class="tab-content">
            <h2 id="verifyTitle">✅ 工时与出勤核对</h2>
            <div class="form-row">
                <div class="form-group">
                    <label id="lblVerifyDate">📅 日期</label>
                    <input type="date" id="verifyDate">
                </div>
                <div class="form-group">
                    <label id="lblVerifyTeam">👷 班组</label>
                    <select id="verifyTeam">
                        <option value="all" id="optAll">全部</option>
                        <option value="马玉奇(Ma Yuqi)">马玉奇(Ma Yuqi)</option>
                        <option value="王建(Wang Jian)">王建(Wang Jian)</option>
                        <option value="Kumar">Kumar</option>
                        <option value="郭传海(Guo Chuanhai)">郭传海(Guo Chuanhai)</option>
                        <option value="曹桂龙(Cao Guilong)">曹桂龙(Cao Guilong)</option>
                        <option value="陈传军(Chen Chuanjun)">陈传军(Chen Chuanjun)</option>
                        <option value="王世杰(Wang Shijie)">王世杰(Wang Shijie)</option>
                        <option value="Sheharyar">Sheharyar</option>
                        <option value="Anwar">Anwar</option>
                    </select>
                </div>
                <div class="form-group" style="justify-content:flex-end;">
                    <button class="btn btn-secondary" onclick="loadVerification()" id="btnVerify">🔍 查询</button>
                </div>
            </div>
            <div id="verifyResult" style="margin-top:15px;"></div>
            <div id="verifyStats" style="margin-top:15px;"></div>
        </div>
        
        <!-- ===== Tab: 设置 ===== -->
        <div id="tab-settings" class="tab-content">
            <h2 id="settingsTitle">⚙️ 设置</h2>
            <h3 id="userMgmtTitle">👥 用户管理</h3>
            <div id="userList"></div>
            <hr class="section-divider">
            <h3 id="addUserTitle">➕ 添加用户</h3>
            <div class="form-row">
                <div class="form-group">
                    <label id="lblNewUser">用户名</label>
                    <input type="text" id="newUsername" placeholder="用户名">
                </div>
                <div class="form-group">
                    <label id="lblNewPass">密码</label>
                    <input type="text" id="newPassword" placeholder="密码">
                </div>
                <div class="form-group">
                    <label id="lblNewDisplay">显示名称</label>
                    <input type="text" id="newDisplayName" placeholder="显示名称">
                </div>
                <div class="form-group">
                    <label id="lblNewRole">角色</label>
                    <select id="newRole">
                        <option value="admin">admin</option>
                        <option value="viewer">viewer</option>
                        <option value="entry">entry</option>
                    </select>
                </div>
            </div>
            <button class="btn btn-primary" onclick="addUser()" id="btnAddUser">➕ 添加用户</button>
            <hr class="section-divider">
            <h3 id="dangerTitle">⚠️ 危险操作</h3>
            <div class="danger-zone">
                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                    <button class="btn btn-secondary" onclick="exportBackup()" id="btnBackup">💾 备份数据</button>
                    <button class="btn btn-secondary" onclick="importBackup()" id="btnImport">📂 恢复备份</button>
                    <button class="btn btn-warning" onclick="clearZeroData()" id="btnClearZero">🧹 清理零数据</button>
                    <button class="btn btn-warning" onclick="deduplicateData()" id="btnDedup">🔄 去重</button>
                    <button class="btn btn-danger" onclick="resetAllData()" id="btnReset">💣 重置所有数据</button>
                </div>
                <p style="margin-top:10px;font-size:13px;color:#666;" id="dangerHint">⚠️ 清理零数据将删除所有数量为0的记录，去重将删除重复记录，重置将删除所有数据。</p>
            </div>
            <hr class="section-divider">
            <h3 id="loginLogsTitle">📋 登录记录</h3>
            <div id="loginLogs"></div>
        </div>
    </div>
</div>

<!-- 加载动画 -->
<div id="loadingOverlay" class="loading">
    <div class="spinner"></div>
    <p style="margin-top:10px;color:#666;">加载中...</p>
</div>

async function supabaseFetch(table, options = {}) {
    const { method = 'GET', body = null, headers = {} } = options;
    const url = `${SUPABASE_URL}/rest/v1/${table}`;
    const defaultHeaders = {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        ...headers
    };
    
    try {
        const response = await fetch(url, {
            method,
            headers: defaultHeaders,
            body: body ? JSON.stringify(body) : null
        });
        if (!response.ok) {
            const error = await response.text();
            throw new Error(`Supabase error: ${response.status} - ${error}`);
        }
        return await response.json();
    } catch (error) {
        console.error('Supabase fetch error:', error);
        throw error;
    }
}

async function supabaseQuery(table, params = {}) {
    let url = `${SUPABASE_URL}/rest/v1/${table}`;
    const queryParams = new URLSearchParams();
    
    if (params.select) queryParams.append('select', params.select);
    if (params.order) queryParams.append('order', params.order);
    if (params.limit) queryParams.append('limit', params.limit);
    if (params.eq) {
        for (const [key, value] of Object.entries(params.eq)) {
            queryParams.append(`${key}=eq.${encodeURIComponent(value)}`);
        }
    }
    if (params.neq) {
        for (const [key, value] of Object.entries(params.neq)) {
            queryParams.append(`${key}=neq.${encodeURIComponent(value)}`);
        }
    }
    
    if (queryParams.toString()) {
        url += `?${queryParams.toString()}`;
    }
    
    // ✅ 确保正确传递 API Key
    const response = await fetch(url, {
        headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Content-Type': 'application/json'
        }
    });
    
    if (!response.ok) {
        const error = await response.text();
        console.error('Supabase error:', error);
        throw new Error(`Supabase query error: ${response.status} - ${error}`);
    }
    return response.json();
}

let categoryMap = {};

async function loadCategoriesFromSupabase() {
    try {
        console.log('🔍 开始加载分类...');
        const url = SUPABASE_URL + '/rest/v1/work_dictionary?select=cat_zh,cat_en';
        console.log('📡 请求URL:', url);
        
        const response = await fetch(url, {
            headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
            }
        });
        
        console.log('📊 响应状态:', response.status);
        
        if (!response.ok) {
            const errorText = await response.text();
            console.error('❌ 请求失败:', errorText);
            showToast('❌ 加载字典失败: ' + response.status);
            return [];
        }
        
        const data = await response.json();
        console.log('✅ 原始数据:', data);
        console.log('📊 数据条数:', data.length);
        
        if (!data || data.length === 0) {
            console.warn('⚠️ 字典表为空');
            showToast('⚠️ 字典表没有数据');
            return [];
        }
        
        // 提取分类
        const catMap = {};
        const zhCategories = [];
        const enCategories = [];
        
        data.forEach(item => {
            if (item.cat_zh && !catMap[item.cat_zh]) {
                catMap[item.cat_zh] = item.cat_en || item.cat_zh;
                zhCategories.push(item.cat_zh);
                enCategories.push(item.cat_en || item.cat_zh);
            }
        });
        
        console.log('✅ 分类列表:', zhCategories);
        
        // 保存到全局
        window.zhCategories = zhCategories;
        window.enCategories = enCategories;
        window.categoryMap = catMap;
        
        showToast('✅ 加载了 ' + zhCategories.length + ' 个分类');
        return data;
        
    } catch (error) {
        console.error('❌ 加载分类失败:', error);
        showToast('❌ 加载失败: ' + error.message);
        return [];
    }
}
async function onCategoryChange() {
    const lang = currentLang;
    const categorySelect = document.getElementById('entryCategory');
    
    // 如果分类还没加载，先加载
    if (!window.zhCategories || window.zhCategories.length === 0) {
        await loadCategoriesFromSupabase();
    }
    
    // 如果仍然没有数据，使用硬编码备用
    if (!window.zhCategories || window.zhCategories.length === 0) {
        console.warn('⚠️ 使用硬编码分类');

let workItemsMap = {};

async function loadWorkItemsFromSupabase() {
    try {
        const data = await supabaseQuery('work_dictionary', {
            select: '*'
        });
        workItemsMap = {};
        data.forEach(item => {
            if (!workItemsMap[item.cat_zh]) {
                workItemsMap[item.cat_zh] = {
                    zhItems: [],
                    enItems: [],
                    details: {}
                };
            }
            workItemsMap[item.cat_zh].zhItems.push(item.content_zh);
            workItemsMap[item.cat_zh].enItems.push(item.content_en);
            workItemsMap[item.cat_zh].details[item.content_zh] = {
                code: item.code || 'N/A',
                unit: item.unit || 'N/A'
            };
        });
        window.workItemsMap = workItemsMap;
        return data;
    } catch (error) {
        console.error('加载工作内容失败:', error);
        return [];
    }
}

    const subSelect = document.getElementById('entrySubItem');
    const selectedValue = subSelect.value || (window.workItemsMap && window.workItemsMap[category] ? window.workItemsMap[category].zhItems[0] : '');
    
    // 如果数据还没加载，先加载
    if (!window.workItemsMap) {
        await loadWorkItemsFromSupabase();
    }
    
    subSelect.innerHTML = '';
    
    const categoryData = window.workItemsMap[category] || { zhItems: [], enItems: [], details: {} };
    const displayItems = lang === 'zh' ? categoryData.zhItems : categoryData.enItems;
    const zhItems = categoryData.zhItems;
    
    displayItems.forEach((item, index) => {
        const option = document.createElement('option');
        const zhValue = zhItems[index] || item;
        option.value = zhValue;
        option.textContent = item;
        if (zhValue === selectedValue) {
            option.selected = true;
        }
        subSelect.appendChild(option);
    });
    
    // 更新编号和单位
    const detail = categoryData.details[subSelect.value] || { code: 'N/A', unit: 'N/A' };
    document.getElementById('entryCode').value = detail.code;
    document.getElementById('entryUnit').value = detail.unit;
}

async function loadUsersFromSupabase() {

                password: u.password,

async function handleLogin() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    const msg = document.getElementById('loginMessage');
    
    if (!username || !password) {
        msg.textContent = '❌ ' + (currentLang === 'zh' ? '请输入用户名和密码' : 'Please enter username and password');
        msg.style.color = 'red';
        return;
    }
    
    try {
        const users = await loadUsersFromSupabase();
        const user = users.find(u => u.username === username);
        
        if (!user) {
            msg.textContent = '❌ ' + (currentLang === 'zh' ? '用户不存在' : 'User not found');
            msg.style.color = 'red';
            return;
        }
        
        if (user.password !== password) {
            msg.textContent = '❌ ' + (currentLang === 'zh' ? '密码错误' : 'Incorrect password');
            msg.style.color = 'red';
            return;
        }
        
        currentUser = username;
        currentRole = user.role;
        isAdmin = currentRole === 'admin';
        
        document.getElementById('userDisplayName').textContent = '👤 ' + user.display_name;
        const badge = document.getElementById('userRoleBadge');
        badge.textContent = t('role' + currentRole.charAt(0).toUpperCase() + currentRole.slice(1));
        badge.className = 'user-role-badge ' + currentRole;
        
        document.getElementById('loginPage').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        
        await addLoginLog(username, user.display_name, user.role);
        updateTabVisibility();
        updateRoleHint();
        initApp();
        updateUI();
        
        showToast(t('loginWelcome') + user.display_name + '！');
        msg.textContent = '';
    } catch (error) {
        msg.textContent = '❌ ' + (currentLang === 'zh' ? '连接服务器失败，请重试' : 'Connection failed, please retry');
        msg.style.color = 'red';
        console.error(error);
    }
}

function updateTabVisibility() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
        const roles = btn.dataset.role.split(',');
        if (roles.includes(currentRole)) {
            btn.classList.remove('hidden');
        } else {
            btn.classList.add('hidden');
        }
    });
    
    const visibleTabs = document.querySelectorAll('.tab-btn:not(.hidden)');
    if (visibleTabs.length > 0) {
        const firstTab = visibleTabs[0];
        const activeTab = document.querySelector('.tab-btn.active');
        if (activeTab && activeTab.classList.contains('hidden')) {
            switchTab(firstTab.dataset.tab);
        }
        if (!document.querySelector('.tab-btn.active')) {
            switchTab(firstTab.dataset.tab);
        }
    }
}

function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
    document.getElementById(`tab-${tab}`).classList.add('active');
    if (tab === 'overview') loadOverview();
    if (tab === 'attendance') loadAttendance();
    if (tab === 'verify') loadVerification();
    if (tab === 'settings') { loadUserList(); loadLoginLogs(); }
}

function addToPending() {
    const record = {
        Date: document.getElementById('entryDate').value,
        Area: document.getElementById('entryArea').value,
        Team: document.getElementById('entryTeam').value,
        "Tag Number": document.getElementById('entryTag').value || 'N/A',
        Code: document.getElementById('entryCode').value,
        "Sub-item": document.getElementById('entryCategory').value,
        "Description of Work": document.getElementById('entrySubItem').value,
        Unit: document.getElementById('entryUnit').value,
        "Qty.": parseFloat(document.getElementById('entryQty').value) || 0,
        "UG Pipe length (m)": parseFloat(document.getElementById('entryPipe').value) || 0,
        Manpower: parseInt(document.getElementById('entryManpower').value) || 0,
        Manhours: parseFloat(document.getElementById('entryManhours').value) || 0,
        "Non-Chinese": parseInt(document.getElementById('entryForeign').value) || 0,
        Remark: document.getElementById('entryRemark').value || '',
        "Created By": currentUser || 'unknown'
    };
    
    if (!record.Date || !record.Area || !record.Team) {
        showToast(t('errorFillAll'));
        return;
    }
    
    const duplicate = pendingItems.some(item => 
        item.Date === record.Date && 
        item.Area === record.Area && 
        item.Team === record.Team && 
        item["Description of Work"] === record["Description of Work"]
    );
    if (duplicate) {
        showToast(currentLang === 'zh' ? '⚠️ 已存在相同记录' : '⚠️ Duplicate record exists');
        return;
    }
    
    pendingItems.push(record);
    renderPending();
    savePending();
    showToast('✅ ' + (currentLang === 'zh' ? '已添加到待提交列表' : 'Added to pending list'));
    
    document.getElementById('entryTag').value = '';
    document.getElementById('entryQty').value = '0';
    document.getElementById('entryPipe').value = '0';
    document.getElementById('entryManpower').value = '0';
    document.getElementById('entryManhours').value = '0';
    document.getElementById('entryForeign').value = '0';
    document.getElementById('entryRemark').value = '';
}

function renderPending() {

    const countEl = document.getElementById('pendingCount');

    if (pendingItems.length === 0) {
        container.innerHTML = '<p style="color:#999;padding:20px;text-align:center;">' + t('noPending') + '</p>';

    }

    pendingItems.forEach((item, index) => {
        const desc = item["Description of Work"] || '';
        const qty = item["Qty."] || 0;
        const mp = item.Manpower || 0;
        html += `<div class="pending-item">
            <div class="info">
                <strong>${item.Date}</strong> | ${item.Area} | ${item.Team} | ${desc.substring(0, 30)}${desc.length > 30 ? '...' : ''}

function removePending(index) {
    pendingItems.splice(index, 1);

    savePending();
}

        showToast('🗑️ ' + (currentLang === 'zh' ? '已清空待提交列表' : 'Pending list cleared'));

}

function savePending() {
    localStorage.setItem('pending_items', JSON.stringify(pendingItems));
}

function loadPending() {
    const saved = localStorage.getItem('pending_items');
    if (saved) {
        try {
            pendingItems = JSON.parse(saved);
            renderPending();
        } catch(e) {
            pendingItems = [];
        }

async function submitAll() {
    if (pendingItems.length === 0) {
        showToast('❌ ' + (currentLang === 'zh' ? '没有待提交的记录' : 'No pending records'));
        return;
    }
    if (!confirm(t('confirmSubmit').replace('{count}', pendingItems.length))) return;
    
    try {
        // 转换字段名以匹配数据库
        const records = pendingItems.map(item => ({
            date: item.Date,
            area: item.Area,
            team: item.Team,
            tag_number: item["Tag Number"],
            code: item.Code,
            sub_item: item["Sub-item"],
            description: item["Description of Work"],
            unit: item.Unit,
            qty: item["Qty."],
            pipe_length: item["UG Pipe length (m)"],
            manpower: item.Manpower,
            manhours: item.Manhours,
            non_chinese: item["Non-Chinese"],
            remark: item.Remark,
            created_by: item["Created By"]
        }));
        
        for (const record of records) {
            await supabaseFetch('daily_reports', {
                method: 'POST',
                body: record
            });
        }
        
        const count = pendingItems.length;
        pendingItems = [];
        renderPending();
        savePending();
        loadOverview();
        showToast(t('successSubmit').replace('{count}', count));
    } catch (error) {
        showToast('❌ ' + (currentLang === 'zh' ? '提交失败，请重试' : 'Submit failed, please retry'));
        console.error(error);
    }
}

function renderAttendance(data) {
    const container = document.getElementById('attendanceTable');
    const map = {};
    data.forEach(d => map[d.worker_type] = d);
    
    let html = '<table><thead><tr><th>' + t('workerType') + '</th><th>' + t('expected') + '</th><th>' + t('present') + '</th><th>' + t('absent') + '</th><th>' + t('foreignLabel') + '</th><th>' + t('remarkLabel') + '</th></tr></thead><tbody>';
    
    let totalExpected = 0;
    let totalPresent = 0;
    let totalForeign = 0;
    
    WORKER_TYPES.forEach((type) => {
        const row = map[type] || { total: 0, present: 0, foreign_count: 0, remark: '' };
        const total = row.total || 0;
        const present = row.present || 0;
        const absent = total - present;
        const foreign = row.foreign_count || 0;
        const chinese = total - foreign;
        
        totalExpected += total;
        totalPresent += present;
        totalForeign += foreign;
        
        html += `<tr>
            <td><strong>${type}</strong></td>
            <td><input type="number" class="att-input" data-type="${type}" data-field="total" value="${total}" min="0" onchange="updateAbsent(this)"></td>
            <td><input type="number" class="att-input" data-type="${type}" data-field="present" value="${present}" min="0" onchange="updateAbsent(this)"></td>
            <td style="color:${absent > 0 ? '#c62828' : '#4caf50'};font-weight:bold;">${absent}</td>
            <td><input type="number" class="att-input" data-type="${type}" data-field="foreign_count" value="${foreign}" min="0"></td>
            <td><input type="text" class="att-input att-input-wide" data-type="${type}" data-field="remark" value="${row.remark || ''}" placeholder="${t('remarkLabel')}"></td>
        </tr>`;
    });
    
    // 合计行
    const totalAbsent = totalExpected - totalPresent;
    const totalChinese = totalExpected - totalForeign;
    html += `<tr class="attendance-row-total">
        <td><strong>${currentLang === 'zh' ? '合计' : 'Total'}</strong></td>
        <td><strong>${totalExpected}</strong></td>
        <td><strong>${totalPresent}</strong></td>
        <td style="color:${totalAbsent > 0 ? '#c62828' : '#4caf50'};font-weight:bold;">${totalAbsent}</td>
        <td><strong>${totalForeign}</strong></td>
        <td><strong>${totalChinese}</strong></td>
    </tr>`;
    
    html += '</tbody></table>';
    container.innerHTML = html;
}

function updateAbsent(el) {
    const row = el.closest('tr');
    const type = el.dataset.type;
    const total = parseInt(row.querySelector(`.att-input[data-type="${type}"][data-field="total"]`)?.value) || 0;
    const present = parseInt(row.querySelector(`.att-input[data-type="${type}"][data-field="present"]`)?.value) || 0;
    const absent = total - present;
    const cell = row.querySelector('td:nth-child(4)');
    if (cell) {
        cell.textContent = absent;
        cell.style.color = absent > 0 ? '#c62828' : '#4caf50';
    }
}

async function renderAttendanceSummary(date) {
    const container = document.getElementById('attendanceSummary');
    try {
        const data = await supabaseQuery('attendance', { eq: { date: date } });
        
        if (data.length === 0) {
            container.innerHTML = '<p style="color:#999;padding:10px;">' + t('noDataDate') + '</p>';
            return;
        }
        
        let html = '<table><thead><tr><th>' + t('teamCol') + '</th><th>' + t('detail') + '</th></tr></thead><tbody>';
        const teams = [...new Set(data.map(d => d.team))];
        teams.forEach(team => {
            const records = data.filter(d => d.team === team);
            let details = records.map(d => {
                const total = d.total || 0;
                const absent = (d.total || 0) - (d.present || 0);
                return d.worker_type + total + (currentLang === 'zh' ? '人' : '') + (absent > 0 ? (currentLang === 'zh' ? '(缺勤' + absent + '人)' : '(absent ' + absent + ')') : '');
            }).join('、');
            html += `<tr><td>${team}</td><td>${details || (currentLang === 'zh' ? '无数据' : 'No data')}</td></tr>`;
        });
        html += '</tbody></table>';
        container.innerHTML = html;
    } catch (error) {
        console.error('加载汇总失败:', error);
        container.innerHTML = '<p style="color:#999;padding:10px;">加载失败</p>';
    }
}

async function saveAttendance() {
    const date = document.getElementById('attDate').value;
    const team = document.getElementById('attTeam').value;
    if (!date || !team) { showToast('❌ ' + (currentLang === 'zh' ? '请选择日期和班组' : 'Please select date and team')); return; }
    
    const records = [];
    document.querySelectorAll('.att-input[data-field="total"]').forEach(inp => {
        const type = inp.dataset.type;
        const total = parseInt(inp.value) || 0;
        const present = parseInt(document.querySelector(`.att-input[data-type="${type}"][data-field="present"]`)?.value) || 0;
        const foreign = parseInt(document.querySelector(`.att-input[data-type="${type}"][data-field="foreign_count"]`)?.value) || 0;
        const remark = document.querySelector(`.att-input[data-type="${type}"][data-field="remark"]`)?.value || '';
        if (total > 0 || present > 0) {
            records.push({
                date: date,
                team: team,
                worker_type: type,
                total: total,
                present: present,
                absent: total - present,
                foreign_count: foreign,
                remark: remark,
                reported_by: currentUser || 'unknown'
            });
        }
    });
    
    if (records.length === 0) {
        showToast('❌ ' + (currentLang === 'zh' ? '请至少填报一个工种' : 'Please fill in at least one worker type'));
        return;
    }
    
    try {
        // 先删除该日期该班组的旧数据
        const existing = await supabaseQuery('attendance', {
            eq: { date: date, team: team }
        });
        for (const item of existing) {
            await supabaseFetch(`attendance?id=eq.${item.id}`, {
                method: 'DELETE'
            });
        }
        
        // 插入新数据
        for (const record of records) {
            await supabaseFetch('attendance', {
                method: 'POST',
                body: record
            });
        }
        
        showToast(t('successSaved'));
        loadAttendance();
    } catch (error) {
        showToast('❌ ' + (currentLang === 'zh' ? '保存失败，请重试' : 'Save failed, please retry'));
        console.error(error);
    }
}

// ============================================================
//  工时核对 (Supabase)
// ============================================================
async function loadVerification() {
    const date = document.getElementById('verifyDate').value;
    const teamFilter = document.getElementById('verifyTeam').value;
    if (!date) return;
    
    try {
        const attendance = await supabaseQuery('attendance', { eq: { date: date } });
        const reports = await supabaseQuery('daily_reports', { eq: { date: date } });
        
        const filteredTeams = teamFilter === 'all' ? TEAMS : [teamFilter];
        
        let html = '<table><thead><tr><th>' + t('teamCol') + '</th><th>' + t('expected') + '</th><th>' + t('present') + '</th><th>' + t('manpower') + '</th><th>' + t('manhours') + '</th><th>' + t('matched') + '</th><th>' + t('diff') + '</th></tr></thead><tbody>';
        let totalExpected = 0, totalPresent = 0, totalManpower = 0, totalManhours = 0, matchedCount = 0;
        let teamsWithData = 0;
        
        filteredTeams.forEach(team => {
            const att = attendance.filter(a => a.team === team);
            const totalAtt = att.reduce((s, a) => s + (a.total || 0), 0);
            const presentAtt = att.reduce((s, a) => s + (a.present || 0), 0);
            
            const rep = reports.filter(r => r.team === team);
            const totalMp = rep.reduce((s, r) => s + (r.manpower || 0), 0);
            const totalMh = rep.reduce((s, r) => s + (r.manhours || 0), 0);
            
            const hasData = totalAtt > 0 || totalMp > 0;
            if (hasData) teamsWithData++;
            
            const matched = totalAtt === totalMp && totalAtt > 0;
            const diff = totalAtt - totalMp;
            if (matched && totalAtt > 0) matchedCount++;
            
            totalExpected += totalAtt;
            totalPresent += presentAtt;
            totalManpower += totalMp;
            totalManhours += totalMh;
            
            const rowClass = hasData ? (matched ? 'row-matched' : 'row-unmatched') : '';
            html += `<tr class="${rowClass}">
                <td>${team}</td>
                <td>${totalAtt}</td>
                <td>${presentAtt}</td>
                <td>${totalMp}</td>
                <td>${totalMh.toFixed(1)}</td>
                <td>${hasData ? (matched ? '✅' : '❌') : '-'}</td>
                <td style="color:${diff !== 0 && hasData ? '#c62828' : '#4caf50'}">${hasData ? diff : '-'}</td>
            </tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('verifyResult').innerHTML = html;
        
        const statsHtml = `
            <div class="stats">
                <div class="stat-card"><div class="stat-number">${totalExpected}</div><div class="stat-label">${currentLang === 'zh' ? '总应到' : 'Total Expected'}</div></div>
                <div class="stat-card"><div class="stat-number">${totalPresent}</div><div class="stat-label">${currentLang === 'zh' ? '总实到' : 'Total Present'}</div></div>
                <div class="stat-card"><div class="stat-number">${totalManpower}</div><div class="stat-label">${currentLang === 'zh' ? '总工时人数' : 'Total Manpower'}</div></div>
                <div class="stat-card"><div class="stat-number">${totalManhours.toFixed(1)}</div><div class="stat-label">${currentLang === 'zh' ? '总工时' : 'Total Manhours'}</div></div>
                <div class="stat-card"><div class="stat-number">${matchedCount}/${teamsWithData || 1}</div><div class="stat-label">${currentLang === 'zh' ? '匹配班组' : 'Matched Teams'}</div></div>
            </div>
        `;
        document.getElementById('verifyStats').innerHTML = statsHtml;
    } catch (error) {
        console.error('加载核对数据失败:', error);
        document.getElementById('verifyResult').innerHTML = '<p style="color:#999;padding:20px;">加载失败</p>';
    }
}

// ============================================================
//  用户管理 (Supabase)
// ============================================================
async function loadUserList() {
    try {
        const users = await supabaseQuery('users', { select: '*' });
        const container = document.getElementById('userList');
        let html = '<table><thead><tr><th>' + (currentLang === 'zh' ? '用户名' : 'Username') + '</th><th>' + (currentLang === 'zh' ? '显示名称' : 'Display Name') + '</th><th>' + (currentLang === 'zh' ? '角色' : 'Role') + '</th><th>' + (currentLang === 'zh' ? '操作' : 'Action') + '</th></tr></thead><tbody>';
        let hasUsers = false;
        for (const user of users) {
            if (user.username === 'admin') continue;
            hasUsers = true;
            html += `<tr>
                <td>${user.username}</td>
                <td>${user.display_name}</td>
                <td>${user.role}</td>
                <td><button class="btn btn-danger btn-sm" onclick="deleteUser('${user.username}')">${currentLang === 'zh' ? '删除' : 'Delete'}</button></td>
            </tr>`;
        }
        if (!hasUsers) {
            html += `<tr><td colspan="4" style="text-align:center;color:#999;">${currentLang === 'zh' ? '暂无其他用户' : 'No other users'}</td></tr>`;
        }
        html += '</tbody></table>';
        container.innerHTML = html;
    } catch (error) {
        console.error('加载用户列表失败:', error);
        document.getElementById('userList').innerHTML = '<p style="color:#999;padding:10px;">加载失败</p>';
    }
}

async function deleteUser(username) {
    if (username === 'admin') return;
    if (confirm(t('deleteConfirm').replace('{name}', username))) {
        try {
            await supabaseFetch(`users?username=eq.${username}`, {
                method: 'DELETE'
            });
            showToast(t('userDeleted'));
            loadUserList();
        } catch (error) {
            showToast('❌ ' + (currentLang === 'zh' ? '删除失败' : 'Delete failed'));
            console.error(error);
        }
    }
}

async function addUser() {
    const username = document.getElementById('newUsername').value.trim();
    const password = document.getElementById('newPassword').value;
    const displayName = document.getElementById('newDisplayName').value.trim();
    const role = document.getElementById('newRole').value;
    
    if (!username || !password || !displayName) {
        showToast(t('errorFillComplete'));
        return;
    }
    
    try {
        const existing = await supabaseQuery('users', { eq: { username: username } });
        if (existing.length > 0) {
            showToast(t('errorUserExists'));
            return;
        }
        
        await supabaseFetch('users', {
            method: 'POST',
            body: {
                username: username,
                password: password,
                role: role,
                display_name: displayName
            }
        });
        
        showToast(t('successAddUser').replace('{name}', displayName));
        loadUserList();
        document.getElementById('newUsername').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('newDisplayName').value = '';
    } catch (error) {
        showToast('❌ ' + (currentLang === 'zh' ? '添加失败' : 'Add failed'));
        console.error(error);
    }
}

function importBackup() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async function(ev) {
            try {
                const data = JSON.parse(ev.target.result);
                if (data.users) {
                    for (const user of data.users) {
                        await supabaseFetch('users', {
                            method: 'POST',
                            body: user
                        }).catch(() => {});
                    }
                }
                if (data.daily_reports) {
                    for (const report of data.daily_reports) {
                        await supabaseFetch('daily_reports', {
                            method: 'POST',
                            body: report
                        }).catch(() => {});
                    }
                }
                if (data.attendance_data) {
                    for (const att of data.attendance_data) {
                        await supabaseFetch('attendance', {
                            method: 'POST',
                            body: att
                        }).catch(() => {});
                    }
                }
                showToast(t('successRestore'));
                loadOverview();
                loadAttendance();
                loadUserList();
                loadLoginLogs();
            } catch(err) {
                showToast('❌ ' + (currentLang === 'zh' ? '恢复失败，文件格式错误' : 'Restore failed, invalid file format'));
            }
        };
        reader.readAsText(file);
    };
    input.click();
}

async function clearZeroData() {
    if (!confirm(t('confirmClearZero'))) return;
    try {
        const data = await supabaseQuery('daily_reports', { select: '*' });
        const toDelete = data.filter(d => {
            const nums = [d.qty || 0, d.pipe_length || 0, d.manpower || 0, d.manhours || 0, d.non_chinese || 0];
            return nums.every(n => n === 0);
        });
        let count = 0;
        for (const item of toDelete) {
            await supabaseFetch(`daily_reports?id=eq.${item.id}`, {
                method: 'DELETE'
            });
            count++;
        }
        showToast(t('successClearZero').replace('{count}', count));
        loadOverview();
    } catch (error) {
        showToast('❌ ' + (currentLang === 'zh' ? '清理失败' : 'Clear failed'));
        console.error(error);
    }
}

async function deduplicateData() {
    if (!confirm(t('confirmDedup'))) return;
    try {
        const data = await supabaseQuery('daily_reports', { select: '*' });
        const keys = ['date', 'area', 'team', 'tag_number', 'code', 'description'];
        const seen = new Set();
        const duplicates = [];
        data.forEach(d => {
            const key = keys.map(k => d[k] || '').join('|');
            if (seen.has(key)) {
                duplicates.push(d);
            } else {
                seen.add(key);
            }
        });
        let count = 0;
        for (const item of duplicates) {
            await supabaseFetch(`daily_reports?id=eq.${item.id}`, {
                method: 'DELETE'
            });
            count++;
        }
        showToast(t('successDedup').replace('{count}', count));
        loadOverview();
    } catch (error) {
        showToast('❌ ' + (currentLang === 'zh' ? '去重失败' : 'Dedup failed'));
        console.error(error);
    }
}

async function resetAllData() {
    if (!confirm(t('confirmReset'))) return;
    if (!confirm(t('confirmReset2'))) return;
    try {
        const tables = ['daily_reports', 'attendance', 'login_logs'];
        for (const table of tables) {
            await supabaseFetch(table, {
                method: 'DELETE'
            });
        }
        showToast(t('successReset'));
        loadOverview();
        loadAttendance();
        loadLoginLogs();
    } catch (error) {
        showToast('❌ ' + (currentLang === 'zh' ? '重置失败' : 'Reset failed'));
        console.error(error);
    }
}

function showToast(msg) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.5s';
        setTimeout(() => toast.remove(), 500);
    }, 3000);
}
