// ===== 数据存储 =====
const STORAGE_KEY = 'daily_report_data';

function setSyncStatus(status, msg) {
    const el = document.getElementById('syncStatus');
    el.className = 'sync-status';
    if (status === 'ok') {
        el.className = 'sync-status ok';
        el.textContent = msg || '✅ 已同步';
    } else if (status === 'syncing') {
        el.className = 'sync-status syncing';
        el.textContent = '⏳ 同步中...';
    } else if (status === 'error') {
        el.className = 'sync-status error';
        el.textContent = '❌ ' + msg || '同步失败';
    }
}

// ===== 自动同步到云端 =====
async function autoSyncToCloud(record) {
    if (isSyncing) return;
    isSyncing = true;
    setSyncStatus('syncing');
    
    try {
        // 保存到本地
        let localData = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        localData.push(record);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(localData));
        
        // 同步到云端
        const { error } = await supabase.from('daily_reports').insert([record]);
        
        if (error) {
            console.warn('云端同步失败，数据已保存到本地:', error);
            setSyncStatus('error', '本地已保存');
            showToast('⚠️ 数据已保存到本地，云端同步失败');
        } else {
            setSyncStatus('ok');
            showToast('✅ 数据已保存并同步到云端');
        }
    } catch (e) {
        console.error('同步错误:', e);
        setSyncStatus('error', '网络错误');
    }
    
    isSyncing = false;
}

// ===== 自动同步考勤到云端 =====
async function autoSyncAttendanceToCloud(records) {
    if (isSyncing) return;
    isSyncing = true;
    setSyncStatus('syncing');
    
    try {
        // 保存到本地
        let localData = JSON.parse(localStorage.getItem(ATTENDANCE_KEY) || '[]');
        const date = records[0]?.date;
        const team = records[0]?.team;
        localData = localData.filter(d => !(d.date === date && d.team === team));
        localData = localData.concat(records);
        localStorage.setItem(ATTENDANCE_KEY, JSON.stringify(localData));
        
        // 同步到云端
        await supabase.from('attendance').delete().eq('date', date).eq('team', team);
        const { error } = await supabase.from('attendance').insert(records);
        
        if (error) {
            console.warn('考勤云端同步失败:', error);
            setSyncStatus('error', '本地已保存');
            showToast('⚠️ 考勤已保存到本地，云端同步失败');
        } else {
            setSyncStatus('ok');
            showToast('✅ 考勤已保存并同步到云端');
        }
    } catch (e) {
        console.error('同步错误:', e);
        setSyncStatus('error', '网络错误');
    }
    
    isSyncing = false;
}

// ===== 从云端加载数据 =====
async function loadFromCloud() {
    setSyncStatus('syncing', '⏳ 加载中...');
    
    try {
        // 加载施工数据
        const { data: reports, error: rError } = await supabase
            .from('daily_reports')
            .select('*')
            .order('created_at', { ascending: false });
        
        if (!rError && reports && reports.length > 0) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(reports));
        }
        
        // 加载考勤数据
        const { data: attendance, error: aError } = await supabase
            .from('attendance')
            .select('*')
            .order('created_at', { ascending: false });
        
        if (!aError && attendance && attendance.length > 0) {
            localStorage.setItem(ATTENDANCE_KEY, JSON.stringify(attendance));
        }
        
        setSyncStatus('ok');
        return true;
    } catch (e) {
        console.error('加载云端数据失败:', e);
        setSyncStatus('error', '加载失败');
        return false;
    }
}

// ===== 初始化 =====
async function initApp() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('entryDate').value = today;
    document.getElementById('attDate').value = today;
    document.getElementById('overviewDate').value = today;
    
    // 从云端加载数据
    await loadFromCloud();
    
    loadPending();
    loadAttendance();
    loadOverview();
    updateDataInfo();
    
    // 每60秒自动同步一次
    setInterval(async () => {
        if (pendingItems.length > 0) {
            await syncPendingToCloud();
        }
    }, 60000);
}

function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.querySelector(`.tab-btn[onclick="switchTab('${tab}')"]`).classList.add('active');
    document.getElementById(`tab-${tab}`).classList.add('active');
    if (tab === 'overview') loadOverview();
    if (tab === 'attendance') loadAttendance();
    if (tab === 'settings') updateDataInfo();
}

// ===== 待提交管理（自动同步） =====
function addToPending() {
    const record = {
        date: document.getElementById('entryDate').value,
        area: document.getElementById('entryArea').value,
        team: document.getElementById('entryTeam').value,
        tag: document.getElementById('entryTag').value || 'N/A',
        work: document.getElementById('entryWork').value || '未填写',
        qty: parseFloat(document.getElementById('entryQty').value) || 0,
        manpower: parseInt(document.getElementById('entryManpower').value) || 0,
        manhours: parseFloat(document.getElementById('entryManhours').value) || 0,
        foreign_workers: parseInt(document.getElementById('entryForeign').value) || 0,
        remark: document.getElementById('entryRemark').value || '',
        created_by: currentUser || 'unknown',
        created_at: new Date().toISOString()
    };
    
    if (!record.date || !record.area || !record.team) {
        showToast('❌ 请填写日期、区域和班组');
        return;
    }
    
    pendingItems.push(record);
    renderPending();
    savePending();
    
    // 自动同步到云端
    autoSyncToCloud(record);
    
    // 清空输入
    document.getElementById('entryTag').value = '';
    document.getElementById('entryWork').value = '';
    document.getElementById('entryQty').value = '0';
    document.getElementById('entryManpower').value = '0';
    document.getElementById('entryManhours').value = '0';
    document.getElementById('entryForeign').value = '0';
    document.getElementById('entryRemark').value = '';
}

function addNoWork() {
    const record = {
        date: document.getElementById('entryDate').value,
        area: document.getElementById('entryArea').value,
        team: document.getElementById('entryTeam').value,
        tag: 'N/A',
        work: '无作业',
        qty: 0,
        manpower: 0,
        manhours: 0,
        foreign_workers: 0,
        remark: '无作业',
        created_by: currentUser || 'unknown',
        created_at: new Date().toISOString()
    };
    
    if (!record.date || !record.area || !record.team) {
        showToast('❌ 请填写日期、区域和班组');
        return;
    }
    
    pendingItems.push(record);
    renderPending();
    savePending();
    autoSyncToCloud(record);
    showToast('✅ 已标记无作业');
}

function renderPending() {
    const container = document.getElementById('pendingItems');
    const count = document.getElementById('pendingCount');
    count.textContent = pendingItems.length;
    
    if (pendingItems.length === 0) {
        container.innerHTML = '<p style="color:#999;padding:20px;text-align:center;">暂无待提交记录</p>';
        return;
    }
    
    let html = '';
    pendingItems.forEach((item, index) => {
        html += `<div class="pending-item">
            <div>
                <strong>${item.date}</strong> | ${item.area} | ${item.team} | ${item.work}
                <span style="color:#999;font-size:12px;margin-left:10px;">
                    ${item.qty > 0 ? '数量:' + item.qty : ''}
                    ${item.manpower > 0 ? '人数:' + item.manpower : ''}
                </span>
            </div>
            <button class="btn btn-danger" style="padding:4px 12px;font-size:12px;" onclick="removePending(${index})">删除</button>
        </div>`;
    });
    container.innerHTML = html;
}

function removePending(index) {
    pendingItems.splice(index, 1);
    renderPending();
    savePending();
}

function clearPending() {
    if (confirm('确定清空所有待提交吗？')) {
        pendingItems = [];
        renderPending();
        savePending();
        showToast('🗑️ 已清空');
    }
}

function savePending() {
    localStorage.setItem(PENDING_KEY, JSON.stringify(pendingItems));
}

function loadPending() {
    const saved = localStorage.getItem(PENDING_KEY);
    if (saved) {
        try {
            pendingItems = JSON.parse(saved);
            renderPending();
        } catch(e) {
            pendingItems = [];
        }
    }
}

async function syncPendingToCloud() {
    if (pendingItems.length === 0) return;
    
    try {
        for (const record of pendingItems) {
            const { error } = await supabase.from('daily_reports').insert([record]);
            if (error) console.warn('同步失败:', error);
        }
        pendingItems = [];
        renderPending();
        savePending();
        setSyncStatus('ok');
    } catch (e) {
        console.error('同步待提交失败:', e);
    }
}

function submitAll() {
    if (pendingItems.length === 0) {
        showToast('❌ 没有待提交的记录');
        return;
    }
    if (!confirm(`提交 ${pendingItems.length} 条记录？`)) return;
    
    // 批量同步到云端
    for (const record of pendingItems) {
        autoSyncToCloud(record);
    }
    
    pendingItems = [];
    renderPending();
    savePending();
    loadOverview();
    updateDataInfo();
    showToast(`🎉 成功提交并同步！`);
}

// ===== 考勤管理（自动同步） =====
function loadAttendance() {
    const date = document.getElementById('attDate').value;
    const team = document.getElementById('attTeam').value;
    if (!date) return;
    
    const allData = JSON.parse(localStorage.getItem(ATTENDANCE_KEY) || '[]');
    const filtered = allData.filter(d => d.date === date && d.team === team);
    renderAttendance(filtered);
}

function renderAttendance(data) {
    const container = document.getElementById('attendanceTable');
    const types = ['木工', '瓦工', '钢筋工', '架子工', '旗手', '小工', '起重工', '测量工', '焊工'];
    const map = {};
    data.forEach(d => map[d.worker_type] = d);
    
    let html = '<table><thead><tr><th>工种</th><th>应到</th><th>实到</th><th>缺勤</th><th>外籍</th><th>备注</th></tr></thead><tbody>';
    types.forEach(type => {
        const row = map[type] || { total: 0, present: 0, foreign_workers: 0, remark: '' };
        const absent = (row.total || 0) - (row.present || 0);
        html += `<tr>
            <td><strong>${type}</strong></td>
            <td><input type="number" class="att-input" data-type="${type}" data-field="total" value="${row.total || 0}" min="0"></td>
            <td><input type="number" class="att-input" data-type="${type}" data-field="present" value="${row.present || 0}" min="0"></td>
            <td style="color:${absent > 0 ? '#c62828' : '#4caf50'};font-weight:bold;">${absent}</td>
            <td><input type="number" class="att-input" data-type="${type}" data-field="foreign_workers" value="${row.foreign_workers || 0}" min="0"></td>
            <td><input type="text" class="att-input" data-type="${type}" data-field="remark" value="${row.remark || ''}" placeholder="备注"></td>
        </tr>`;
    });
    html += '</tbody></table>';
    container.innerHTML = html;
    
    document.querySelectorAll('.att-input[data-field="total"], .att-input[data-field="present"]').forEach(inp => {
        inp.addEventListener('input', function() {
            const type = this.dataset.type;
            const total = parseInt(document.querySelector(`.att-input[data-type="${type}"][data-field="total"]`)?.value) || 0;
            const present = parseInt(document.querySelector(`.att-input[data-type="${type}"][data-field="present"]`)?.value) || 0;
            const absent = total - present;
            const row = this.closest('tr');
            if (row) {
                const cell = row.querySelector('td:nth-child(4)');
                if (cell) {
                    cell.textContent = absent;
                    cell.style.color = absent > 0 ? '#c62828' : '#4caf50';
                }
            }
        });
    });
}

function saveAttendance() {
    const date = document.getElementById('attDate').value;
    const team = document.getElementById('attTeam').value;
    if (!date || !team) { showToast('❌ 请选择日期和班组'); return; }
    
    const records = [];
    document.querySelectorAll('.att-input[data-field="total"]').forEach(inp => {
        const type = inp.dataset.type;
        const total = parseInt(inp.value) || 0;
        const present = parseInt(document.querySelector(`.att-input[data-type="${type}"][data-field="present"]`)?.value) || 0;
        const foreign = parseInt(document.querySelector(`.att-input[data-type="${type}"][data-field="foreign_workers"]`)?.value) || 0;
        const remark = document.querySelector(`.att-input[data-type="${type}"][data-field="remark"]`)?.value || '';
        records.push({
            date, team, worker_type: type,
            total, present, absent: total - present,
            foreign_workers: foreign,
            remark,
            created_by: currentUser || 'unknown'
        });
    });
    
    // 自动同步考勤
    autoSyncAttendanceToCloud(records);
    loadAttendance();
}

// ===== 总览 =====
function loadOverview() {
    const date = document.getElementById('overviewDate').value;
    const allData = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    const filtered = date ? allData.filter(d => d.date === date) : allData;
    renderOverview(filtered);
}

function renderOverview(data) {
    const stats = document.getElementById('overviewStats');
    const totalManpower = data.reduce((s, d) => s + (d.manpower || 0), 0);
    const totalManhours = data.reduce((s, d) => s + (d.manhours || 0), 0);
    const areas = new Set(data.map(d => d.area));
    stats.innerHTML = `
        <div class="stat-card"><div class="stat-number">${data.length}</div><div class="stat-label">📊 总记录数</div></div>
        <div class="stat-card"><div class="stat-number">${areas.size}</div><div class="stat-label">📍 区域数</div></div>
        <div class="stat-card"><div class="stat-number">${totalManpower}</div><div class="stat-label">👷 总人数</div></div>
        <div class="stat-card"><div class="stat-number">${totalManhours.toFixed(1)}</div><div class="stat-label">⏱️ 总工时</div></div>
    `;
    
    const table = document.getElementById('overviewTable');
    if (data.length === 0) {
        table.innerHTML = '<p style="color:#999;padding:20px;text-align:center;">暂无数据</p>';
        return;
    }
    let html = '<table><thead><tr><th>日期</th><th>区域</th><th>班组</th><th>工作</th><th>数量</th><th>人数</th><th>工时</th></tr></thead><tbody>';
    data.slice(0, 100).forEach(d => {
        html += `<tr><td>${d.date}</td><td>${d.area}</td><td>${d.team}</td><td>${(d.work || '').substring(0, 30)}</td>
            <td>${d.qty || 0}</td><td>${d.manpower || 0}</td><td>${d.manhours || 0}</td></tr>`;
    });
    html += '</tbody></table>';
    if (data.length > 100) html += `<p style="color:#999;margin-top:10px;">显示前100条，共 ${data.length} 条</p>`;
    table.innerHTML = html;
}

// ===== 导出/导入 =====
function exportData() {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    if (data.length === 0) { showToast('❌ 没有数据可导出'); return; }
    
    const headers = ['date', 'area', 'team', 'work', 'qty', 'manpower', 'manhours', 'foreign_workers', 'remark'];
    let csv = headers.join(',') + '\n';
    data.forEach(row => {
        csv += headers.map(h => `"${(row[h] || '').toString().replace(/"/g, '""')}"`).join(',') + '\n';
    });
    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `施工日报_${new Date().toISOString().split('T')[0]}.csv`;
    link.click();
    showToast('📥 导出成功！');
}

function exportAllData() {
    const data = {
        daily_reports: JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'),
        attendance: JSON.parse(localStorage.getItem(ATTENDANCE_KEY) || '[]'),
        pending: pendingItems
    };
    if (data.daily_reports.length === 0 && data.attendance.length === 0 && data.pending.length === 0) {
        showToast('❌ 没有数据可导出');
        return;
    }
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `施工日报_备份_${new Date().toISOString().split('T')[0]}.json`;
    link.click();
    showToast('📥 导出成功！');
}

function importData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = JSON.parse(e.target.result);
            if (data.daily_reports) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data.daily_reports));
            }
            if (data.attendance) {
                localStorage.setItem(ATTENDANCE_KEY, JSON.stringify(data.attendance));
            }
            if (data.pending) {
                pendingItems = data.pending;
                renderPending();
                savePending();
            }
            showToast('✅ 导入成功！');
            loadOverview();
            loadAttendance();
            updateDataInfo();
        } catch(err) {
            showToast('❌ 导入失败：' + err.message);
        }
    };
    reader.readAsText(file);
    document.getElementById('importFile').value = '';
}

function clearAllData() {
    if (!confirm('⚠️ 确定要清除所有本地数据吗？')) return;
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(ATTENDANCE_KEY);
    localStorage.removeItem(PENDING_KEY);
    pendingItems = [];
    renderPending();
    loadOverview();
    loadAttendance();
    updateDataInfo();
    showToast('🗑️ 所有本地数据已清除');
}

async function clearAllCloudData() {
    if (!confirm('⚠️ 确定要清除所有云端数据吗？此操作不可恢复！')) return;
    if (!confirm('再次确认：真的要删除所有云端数据吗？')) return;
    
    showLoading(true);
    try {
        await supabase.from('daily_reports').delete().neq('id', 0);
        await supabase.from('attendance').delete().neq('id', 0);
        showToast('🗑️ 所有云端数据已清除');
        await loadFromCloud();
        loadOverview();
        loadAttendance();
        updateDataInfo();
    } catch(e) {
        showToast('❌ 清除云端数据失败：' + e.message);
    }
    showLoading(false);
}

function updateDataInfo() {
    const dailyData = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    const attData = JSON.parse(localStorage.getItem(ATTENDANCE_KEY) || '[]');
    document.getElementById('dataStats').innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px;">
            <div style="background:white;padding:10px;border-radius:6px;text-align:center;">
                <div style="font-size:24px;font-weight:bold;color:#1a237e;">${dailyData.length}</div>
                <div style="font-size:12px;color:#666;">施工记录</div>
            </div>
            <div style="background:white;padding:10px;border-radius:6px;text-align:center;">
                <div style="font-size:24px;font-weight:bold;color:#1a237e;">${attData.length}</div>
                <div style="font-size:12px;color:#666;">考勤记录</div>
            </div>
            <div style="background:white;padding:10px;border-radius:6px;text-align:center;">
                <div style="font-size:24px;font-weight:bold;color:#1a237e;">${pendingItems.length}</div>
                <div style="font-size:12px;color:#666;">待提交</div>
            </div>
            <div style="background:white;padding:10px;border-radius:6px;text-align:center;">
                <div style="font-size:24px;font-weight:bold;color:#1a237e;">${dailyData.reduce((s,d) => s + (d.manhours || 0), 0).toFixed(1)}</div>
                <div style="font-size:12px;color:#666;">总工时</div>
            </div>
        </div>
    `;
}

// ===== 工具函数 =====
function showLoading(show) {
    document.getElementById('loadingOverlay').classList.toggle('show', show);
}

function showToast(msg) {
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.5s';
        setTimeout(() => toast.remove(), 500);
    }, 3000);
}

// ===== 启动 =====
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('attDate').addEventListener('change', loadAttendance);
    document.getElementById('attTeam').addEventListener('change', loadAttendance);
    document.getElementById('overviewDate').addEventListener('change', loadOverview);
});
</script>
