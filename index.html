<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日报系统 - Google Sheets版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f4f8; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #1a237e; text-align: center; margin-bottom: 20px; }
        .status { padding: 12px; border-radius: 6px; margin-bottom: 15px; text-align: center; }
        .status.success { background: #e8f5e9; color: #2e7d32; }
        .status.error { background: #ffebee; color: #c62828; }
        .status.loading { background: #fff3e0; color: #e65100; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; color: #333; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .btn { padding: 12px 24px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: #4a90d9; color: white; width: 100%; }
        .btn-primary:hover { background: #357abd; }
        .btn-success { background: #4caf50; color: white; }
        .btn-success:hover { background: #388e3c; }
        .btn-danger { background: #e53935; color: white; }
        .btn-danger:hover { background: #c62828; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .mt-10 { margin-top: 10px; }
        .mt-20 { margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background: #4a90d9; color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #e8edf4; }
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 24px; background: #323232; color: white; border-radius: 8px; z-index: 9999; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 施工日报系统</h1>
    
    <!-- 连接状态 -->
    <div id="status" class="status loading">⏳ 正在连接 Google Sheets...</div>
    
    <!-- ===== 登录 ===== -->
    <div id="loginSection">
        <div class="form-group">
            <label>👤 用户名</label>
            <input type="text" id="username" value="admin" placeholder="请输入用户名">
        </div>
        <div class="form-group">
            <label>🔒 密码</label>
            <input type="password" id="password" value="admin123" placeholder="请输入密码">
        </div>
        <button class="btn btn-primary" onclick="handleLogin()">🔑 登录</button>
        <p id="loginMsg" style="text-align:center;margin-top:10px;color:#e53935;"></p>
    </div>
    
    <!-- ===== 主界面 ===== -->
    <div id="mainSection" class="hidden">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
            <span id="userInfo" style="font-weight:600;">👤 用户</span>
            <button class="btn btn-danger" onclick="handleLogout()" style="padding:6px 16px;font-size:12px;">退出</button>
        </div>
        
        <div style="display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;">
            <button class="btn btn-success" onclick="switchTab('report')">📝 录入</button>
            <button class="btn btn-primary" onclick="switchTab('view')">📊 查看</button>
            <button class="btn btn-primary" onclick="switchTab('attendance')">👷 考勤</button>
        </div>
        
        <!-- Tab: 录入 -->
        <div id="tabReport">
            <div class="row">
                <div class="form-group">
                    <label>📅 日期</label>
                    <input type="date" id="reportDate">
                </div>
                <div class="form-group">
                    <label>📍 区域</label>
                    <select id="reportArea">
                        <option value="110">110</option>
                        <option value="210">210</option>
                        <option value="220">220</option>
                        <option value="240">240</option>
                        <option value="320">320</option>
                        <option value="330">330</option>
                        <option value="400">400</option>
                        <option value="800">800</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>👷 班组</label>
                <select id="reportTeam">
                    <option value="马玉奇">马玉奇</option>
                    <option value="王建">王建</option>
                    <option value="Kumar">Kumar</option>
                    <option value="郭传海">郭传海</option>
                    <option value="曹桂龙">曹桂龙</option>
                </select>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>📊 完成量</label>
                    <input type="number" id="reportQty" value="0" step="0.1">
                </div>
                <div class="form-group">
                    <label>👷 人数</label>
                    <input type="number" id="reportManpower" value="0">
                </div>
            </div>
            <div class="form-group">
                <label>📝 工作描述</label>
                <input type="text" id="reportDesc" placeholder="输入工作内容">
            </div>
            <button class="btn btn-success" onclick="submitReport()">🚀 提交</button>
        </div>
        
        <!-- Tab: 查看 -->
        <div id="tabView" class="hidden">
            <div class="form-group">
                <label>📅 选择日期</label>
                <input type="date" id="viewDate" onchange="loadReports()">
            </div>
            <button class="btn btn-primary" onclick="loadReports()">🔄 刷新</button>
            <div id="reportTable"></div>
        </div>
        
        <!-- Tab: 考勤 -->
        <div id="tabAttendance" class="hidden">
            <div class="form-group">
                <label>📅 日期</label>
                <input type="date" id="attDate">
            </div>
            <div class="form-group">
                <label>👷 班组</label>
                <select id="attTeam">
                    <option value="马玉奇">马玉奇</option>
                    <option value="王建">王建</option>
                    <option value="Kumar">Kumar</option>
                    <option value="郭传海">郭传海</option>
                    <option value="曹桂龙">曹桂龙</option>
                </select>
            </div>
            <div class="row">
                <div class="form-group">
                    <label>应到人数</label>
                    <input type="number" id="attTotal" value="0">
                </div>
                <div class="form-group">
                    <label>实到人数</label>
                    <input type="number" id="attPresent" value="0">
                </div>
            </div>
            <button class="btn btn-success" onclick="submitAttendance()">✅ 提交考勤</button>
            <div id="attTable" class="mt-20"></div>
        </div>
    </div>
</div>

<script>
// ============================================================
//  Google Sheets API 配置
// ============================================================
const SHEETS_API_URL = 'https://script.google.com/macros/s/AKfycbx7KqS7V1COetOHycPHYqii9u6ICN6ZBJHyjZkG3sjcDGZYbwiiYUN4mqVO_xSGFwYXBw/exec';

// ============================================================
//  工具函数
// ============================================================
function showToast(msg, isError = false) {
    const old = document.querySelector('.toast');
    if (old) old.remove();
    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    toast.style.background = isError ? '#c62828' : '#323232';
    document.body.appendChild(toast);
    setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 500); }, 3000);
}

function setStatus(msg, type = 'loading') {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status ' + type;
}

function switchTab(tab) {
    ['Report', 'View', 'Attendance'].forEach(t => {
        document.getElementById('tab' + t).classList.toggle('hidden', t !== tab);
    });
}

// ============================================================
//  Google Sheets API 调用
// ============================================================
async function sheetsGet(action, params = {}) {
    const url = new URL(SHEETS_API_URL);
    url.searchParams.append('action', action);
    Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));
    const response = await fetch(url.toString());
    return await response.json();
}

async function sheetsPost(action, data = {}) {
    const response = await fetch(SHEETS_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, ...data })
    });
    return await response.json();
}

// ============================================================
//  登录功能
// ============================================================
async function handleLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('loginMsg');
    
    if (!username || !password) {
        msg.textContent = '❌ 请输入用户名和密码';
        return;
    }
    
    setStatus('⏳ 验证用户...', 'loading');
    msg.textContent = '';
    
    try {
        const users = await sheetsGet('getUsers');
        const user = users.find(u => u.username === username);
        
        if (!user) {
            msg.textContent = '❌ 用户不存在';
            setStatus('❌ 登录失败', 'error');
            return;
        }
        
        if (user.password !== password) {
            msg.textContent = '❌ 密码错误';
            setStatus('❌ 登录失败', 'error');
            return;
        }
        
        // 登录成功
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('mainSection').classList.remove('hidden');
        document.getElementById('userInfo').textContent = '👤 ' + (user.display_name || username);
        
        // 设置默认日期
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('reportDate').value = today;
        document.getElementById('viewDate').value = today;
        document.getElementById('attDate').value = today;
        
        setStatus('✅ 连接成功！数据存储在 Google Sheets', 'success');
        showToast('🎉 欢迎 ' + (user.display_name || username) + '！');
        
        // 加载数据
        loadReports();
        loadAttendance();
        
    } catch (error) {
        console.error('登录错误:', error);
        msg.textContent = '❌ 连接服务器失败';
        setStatus('❌ 连接失败', 'error');
    }
}

function handleLogout() {
    document.getElementById('loginSection').classList.remove('hidden');
    document.getElementById('mainSection').classList.add('hidden');
    document.getElementById('loginMsg').textContent = '';
    setStatus('⏳ 已退出登录', 'loading');
}

// ============================================================
//  日报功能
// ============================================================
async function submitReport() {
    const date = document.getElementById('reportDate').value;
    const area = document.getElementById('reportArea').value;
    const team = document.getElementById('reportTeam').value;
    const qty = parseFloat(document.getElementById('reportQty').value) || 0;
    const manpower = parseInt(document.getElementById('reportManpower').value) || 0;
    const desc = document.getElementById('reportDesc').value.trim() || '无描述';
    
    if (!date || !area || !team) {
        showToast('❌ 请填写完整信息', true);
        return;
    }
    
    try {
        const result = await sheetsPost('addReport', {
            date: date,
            area: area,
            team: team,
            description: desc,
            qty: qty,
            manpower: manpower,
            created_by: document.getElementById('userInfo').textContent.replace('👤 ', '')
        });
        
        if (result.success) {
            showToast('✅ 提交成功！');
            // 清空输入
            document.getElementById('reportQty').value = '0';
            document.getElementById('reportManpower').value = '0';
            document.getElementById('reportDesc').value = '';
            loadReports();
        } else {
            showToast('❌ 提交失败: ' + (result.error || '未知错误'), true);
        }
    } catch (error) {
        showToast('❌ 提交失败: ' + error.message, true);
        console.error(error);
    }
}

async function loadReports() {
    const date = document.getElementById('viewDate').value;
    if (!date) return;
    
    try {
        const data = await sheetsGet('getReports', { date: date });
        const table = document.getElementById('reportTable');
        
        if (!data || data.length === 0) {
            table.innerHTML = '<p style="color:#999;padding:20px;text-align:center;">📭 该日期暂无数据</p>';
            return;
        }
        
        let html = `<p style="margin:10px 0;color:#666;">共 ${data.length} 条记录</p>
            <table>
                <thead><tr><th>区域</th><th>班组</th><th>工作描述</th><th>完成量</th><th>人数</th></tr></thead>
                <tbody>`;
        
        data.forEach(d => {
            html += `<tr>
                <td>${d.area || ''}</td>
                <td>${d.team || ''}</td>
                <td>${d.description || ''}</td>
                <td>${d.qty || 0}</td>
                <td>${d.manpower || 0}</td>
            </tr>`;
        });
        
        html += '</tbody></table>';
        table.innerHTML = html;
        
    } catch (error) {
        console.error('加载数据失败:', error);
        document.getElementById('reportTable').innerHTML = '<p style="color:#e53935;">❌ 加载失败</p>';
    }
}

// ============================================================
//  考勤功能
// ============================================================
async function submitAttendance() {
    const date = document.getElementById('attDate').value;
    const team = document.getElementById('attTeam').value;
    const total = parseInt(document.getElementById('attTotal').value) || 0;
    const present = parseInt(document.getElementById('attPresent').value) || 0;
    
    if (!date || !team) {
        showToast('❌ 请填写完整信息', true);
        return;
    }
    
    if (total === 0 && present === 0) {
        showToast('⚠️ 请至少填写人数', true);
        return;
    }
    
    try {
        // 先删除旧数据
        await sheetsPost('deleteAttendance', { date: date, team: team });
        
        // 添加新数据
        const result = await sheetsPost('addAttendance', {
            date: date,
            team: team,
            worker_type: '合计',
            total: total,
            present: present,
            absent: total - present,
            reported_by: document.getElementById('userInfo').textContent.replace('👤 ', '')
        });
        
        if (result.success) {
            showToast('✅ 考勤提交成功！');
            document.getElementById('attTotal').value = '0';
            document.getElementById('attPresent').value = '0';
            loadAttendance();
        } else {
            showToast('❌ 提交失败: ' + (result.error || '未知错误'), true);
        }
    } catch (error) {
        showToast('❌ 提交失败: ' + error.message, true);
        console.error(error);
    }
}

async function loadAttendance() {
    const date = document.getElementById('attDate').value;
    if (!date) return;
    
    try {
        const data = await sheetsGet('getAttendance', { date: date });
        const table = document.getElementById('attTable');
        
        if (!data || data.length === 0) {
            table.innerHTML = '<p style="color:#999;padding:20px;text-align:center;">📭 该日期暂无考勤数据</p>';
            return;
        }
        
        let html = `<table>
                <thead><tr><th>班组</th><th>应到</th><th>实到</th><th>缺勤</th></tr></thead>
                <tbody>`;
        
        data.forEach(d => {
            html += `<tr>
                <td>${d.team || ''}</td>
                <td>${d.total || 0}</td>
                <td>${d.present || 0}</td>
                <td style="color:${(d.total - d.present) > 0 ? '#c62828' : '#4caf50'}">${(d.total - d.present) || 0}</td>
            </tr>`;
        });
        
        html += '</tbody></table>';
        table.innerHTML = html;
        
    } catch (error) {
        console.error('加载考勤失败:', error);
        document.getElementById('attTable').innerHTML = '<p style="color:#e53935;">❌ 加载失败</p>';
    }
}

// ============================================================
//  测试连接
// ============================================================
async function testConnection() {
    setStatus('⏳ 测试连接...', 'loading');
    try {
        const users = await sheetsGet('getUsers');
        if (users && Array.isArray(users)) {
            setStatus('✅ 连接成功！发现 ' + users.length + ' 个用户', 'success');
            showToast('✅ Google Sheets 连接成功！');
        } else {
            setStatus('❌ 连接成功但数据格式异常', 'error');
        }
    } catch (error) {
        setStatus('❌ 连接失败: ' + error.message, 'error');
        showToast('❌ 连接失败，请检查配置', true);
        console.error(error);
    }
}

// ============================================================
//  自动测试
// ============================================================
window.onload = function() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('reportDate').value = today;
    document.getElementById('viewDate').value = today;
    document.getElementById('attDate').value = today;
    
    // 自动测试连接
    testConnection();
};
</script>

</body>
</html>
