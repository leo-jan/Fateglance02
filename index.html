<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>施工日报系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f4f8; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #1a237e; text-align: center; margin-bottom: 20px; }
        .status { padding: 10px; border-radius: 6px; margin-bottom: 15px; text-align: center; font-weight: 500; background: #e8f5e9; color: #2e7d32; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: 600; margin-bottom: 4px; color: #333; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn { padding: 12px 24px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; }
        .btn-success { background: #4caf50; color: white; width: 100%; }
        .btn-primary { background: #4a90d9; color: white; }
        .btn-danger { background: #e53935; color: white; padding: 6px 16px; font-size: 12px; }
        .btn-success:hover { background: #388e3c; }
        .btn-primary:hover { background: #357abd; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th { background: #4a90d9; color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #e8edf4; }
        .tab-bar { display: flex; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
        .tab-btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; background: #e8edf4; }
        .tab-btn.active { background: #4a90d9; color: white; }
        .hidden { display: none; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin: 15px 0; }
        .stat-card { background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; border-left: 4px solid #4a90d9; }
        .stat-number { font-size: 28px; font-weight: 700; color: #1a237e; }
        .stat-label { font-size: 13px; color: #666; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 2px solid #e8edf4; }
        .user-info { font-weight: 600; color: #1a237e; }
        .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 24px; background: #323232; color: white; border-radius: 8px; z-index: 9999; }
        .area-badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; background: #e3f2fd; color: #1565c0; }
        @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
        .loading { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 施工日报系统</h1>
    <div id="status" class="status">✅ 已连接到 Supabase</div>
    
    <div id="loginBox">
        <div class="form-group"><label>👤 用户名</label><input type="text" id="username" value="admin"></div>
        <div class="form-group"><label>🔒 密码</label><input type="password" id="password" value="admin123"></div>
        <button class="btn btn-primary" onclick="login()" style="width:100%;">🔑 登录</button>
        <p id="loginMsg" style="color:red;margin-top:10px;text-align:center;"></p>
    </div>
    
    <div id="mainBox" style="display:none;">
        <div class="header-bar">
            <span class="user-info" id="userDisplay">👤 管理员</span>
            <button class="btn btn-danger" onclick="logout()">退出</button>
        </div>
        
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('entry')">📝 录入</button>
            <button class="tab-btn" onclick="switchTab('view')">📊 查看</button>
            <button class="tab-btn" onclick="switchTab('stats')">📈 汇总</button>
        </div>
        
        <div id="tabEntry">
            <div class="row">
                <div class="form-group"><label>📅 日期</label><input type="date" id="reportDate"></div>
                <div class="form-group"><label>📍 区域</label>
                    <select id="reportArea">
                        <option value="110">110</option><option value="210">210</option>
                        <option value="220">220</option><option value="240">240</option>
                        <option value="320">320</option><option value="330">330</option>
                        <option value="400">400</option><option value="800">800</option>
                        <option value="precast yard 1">precast yard 1</option>
                        <option value="precast yard 2">precast yard 2</option>
                    </select>
                </div>
            </div>
            <div class="form-group"><label>👷 班组</label>
                <select id="reportTeam">
                    <option value="马玉奇(Ma Yuqi)">马玉奇(Ma Yuqi)</option>
                    <option value="王建(Wang Jian)">王建(Wang Jian)</option>
                    <option value="Kumar">Kumar</option>
                    <option value="郭传海(Guo Chuanhai)">郭传海(Guo Chuanhai)</option>
                    <option value="曹桂龙(Cao Guilong)">曹桂龙(Cao Guilong)</option>
                    <option value="陈传军(Chen Chuanjun)">陈传军(Chen Chuanjun)</option>
                    <option value="王世杰(Wang Shijie)">王世杰(Wang Shijie)</option>
                    <option value="Sheharyar">Sheharyar</option>
                    <option value="Anwar">Anwar</option>
                </select>
            </div>
            <div class="form-group"><label>📝 工作描述</label><input type="text" id="reportDesc" placeholder="输入工作内容"></div>
            <div class="row">
                <div class="form-group"><label>📊 完成量</label><input type="number" id="reportQty" value="0" step="0.1"></div>
                <div class="form-group"><label>👷 人数</label><input type="number" id="reportManpower" value="0"></div>
            </div>
            <div class="row">
                <div class="form-group"><label>⏱️ 工时</label><input type="number" id="reportManhours" value="0" step="0.5"></div>
                <div class="form-group"><label>🌍 外籍</label><input type="number" id="reportForeign" value="0"></div>
            </div>
            <button class="btn btn-success" onclick="submitReport()">🚀 提交</button>
        </div>
        
        <div id="tabView" class="hidden">
            <div class="form-group"><label>📅 选择日期</label><input type="date" id="viewDate" onchange="loadReports()"></div>
            <button class="btn btn-primary" onclick="loadReports()">🔄 刷新</button>
            <div id="reportTable"></div>
        </div>
        
        <div id="tabStats" class="hidden">
            <div class="row">
                <div class="form-group"><label>📅 开始日期</label><input type="date" id="statsStart"></div>
                <div class="form-group"><label>📅 结束日期</label><input type="date" id="statsEnd"></div>
            </div>
            <button class="btn btn-primary" onclick="loadStats()">📊 生成汇总</button>
            <div id="statsContent"></div>
        </div>
    </div>
</div>

<script>
// ============================================================
//  Supabase 配置（已填入你的信息）
// ============================================================
const SUPABASE_URL = 'https://swjddrwgkhwrsrbfxavz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN3amRkcndna2h3cnNyYmZ4YXZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwMDU5ODYsImV4cCI6MjA5ODU4MTk4Nn0.edvme3sRhGEuus_d6jOAwG5jUvmG6ai43pUE3CpbFTw';

// ============================================================
//  Supabase 操作
// ============================================================
async function supabaseFetch(path, options = {}) {
    const url = `${SUPABASE_URL}/rest/v1/${path}`;
    const headers = {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json'
    };
    const response = await fetch(url, { ...options, headers });
    if (!response.ok) {
        const error = await response.text();
        throw new Error(error);
    }
    return response.json();
}

async function getReports(date) {
    let url = 'reports?select=*&order=id.desc';
    if (date) {
        url += `&date=eq.${date}`;
    }
    return supabaseFetch(url);
}

async function addReport(data) {
    return supabaseFetch('reports', {
        method: 'POST',
        body: JSON.stringify(data)
    });
}

// ============================================================
//  用户
// ============================================================
const USERS = {
    'admin': { password: 'admin123', display_name: '管理员' },
    'zhangsan': { password: '123456', display_name: '张三' },
    'lisi': { password: '123456', display_name: '李四' }
};

let currentUser = null;

// ============================================================
//  登录
// ============================================================
function login() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('loginMsg');
    
    if (!USERS[username] || USERS[username].password !== password) {
        msg.textContent = '❌ 用户名或密码错误';
        return;
    }
    
    currentUser = username;
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('mainBox').style.display = 'block';
    document.getElementById('userDisplay').textContent = '👤 ' + USERS[username].display_name;
    msg.textContent = '';
    
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('reportDate').value = today;
    document.getElementById('viewDate').value = today;
    const weekAgo = new Date();
    weekAgo.setDate(weekAgo.getDate() - 7);
    document.getElementById('statsStart').value = weekAgo.toISOString().split('T')[0];
    document.getElementById('statsEnd').value = today;
    
    loadReports();
}

function logout() {
    currentUser = null;
    document.getElementById('loginBox').style.display = 'block';
    document.getElementById('mainBox').style.display = 'none';
}

// ============================================================
//  提交
// ============================================================
async function submitReport() {
    const date = document.getElementById('reportDate').value;
    const area = document.getElementById('reportArea').value;
    const team = document.getElementById('reportTeam').value;
    const desc = document.getElementById('reportDesc').value.trim() || '未填写';
    const qty = parseFloat(document.getElementById('reportQty').value) || 0;
    const manpower = parseInt(document.getElementById('reportManpower').value) || 0;
    const manhours = parseFloat(document.getElementById('reportManhours').value) || 0;
    const foreign = parseInt(document.getElementById('reportForeign').value) || 0;
    
    if (!date) { alert('请选择日期'); return; }
    if (qty === 0 && manpower === 0 && manhours === 0) {
        alert('请至少填写完成量、人数或工时');
        return;
    }
    
    try {
        await addReport({
            date, area, team, description: desc,
            qty, manpower, manhours, foreign_count: foreign,
            created_by: currentUser,
            created_at: new Date().toISOString()
        });
        alert('✅ 提交成功！');
        document.getElementById('reportDesc').value = '';
        document.getElementById('reportQty').value = '0';
        document.getElementById('reportManpower').value = '0';
        document.getElementById('reportManhours').value = '0';
        document.getElementById('reportForeign').value = '0';
        loadReports();
    } catch(err) {
        alert('❌ 提交失败: ' + err.message);
    }
}

// ============================================================
//  查看
// ============================================================
async function loadReports() {
    const date = document.getElementById('viewDate').value;
    if (!date) return;
    
    try {
        const data = await getReports(date);
        const table = document.getElementById('reportTable');
        if (!data || data.length === 0) {
            table.innerHTML = '<p style="color:#999;padding:20px;text-align:center;">📭 暂无数据</p>';
            return;
        }
        
        const totalQty = data.reduce((s, r) => s + (r.qty || 0), 0);
        const totalManpower = data.reduce((s, r) => s + (r.manpower || 0), 0);
        const totalManhours = data.reduce((s, r) => s + (r.manhours || 0), 0);
        
        let html = `
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:15px;margin:15px 0;">
                <div style="background:#f8f9fa;padding:15px;border-radius:8px;text-align:center;">
                    <div style="font-size:24px;font-weight:700;color:#1a237e;">${data.length}</div>
                    <div style="font-size:12px;color:#666;">📋 记录</div>
                </div>
                <div style="background:#f8f9fa;padding:15px;border-radius:8px;text-align:center;">
                    <div style="font-size:24px;font-weight:700;color:#1a237e;">${totalQty}</div>
                    <div style="font-size:12px;color:#666;">📊 完成量</div>
                </div>
                <div style="background:#f8f9fa;padding:15px;border-radius:8px;text-align:center;">
                    <div style="font-size:24px;font-weight:700;color:#1a237e;">${totalManpower}</div>
                    <div style="font-size:12px;color:#666;">👷 人数</div>
                </div>
                <div style="background:#f8f9fa;padding:15px;border-radius:8px;text-align:center;">
                    <div style="font-size:24px;font-weight:700;color:#1a237e;">${totalManhours.toFixed(1)}</div>
                    <div style="font-size:12px;color:#666;">⏱️ 工时</div>
                </div>
            </div>
            <table><thead><tr><th>区域</th><th>班组</th><th>描述</th><th>完成量</th><th>人数</th><th>工时</th><th>填表人</th></tr></thead><tbody>`;
        
        data.forEach(r => {
            html += `<tr>
                <td><span class="area-badge">${r.area}</span></td>
                <td>${r.team}</td>
                <td>${r.description || '-'}</td>
                <td>${r.qty || 0}</td>
                <td>${r.manpower || 0}</td>
                <td>${(r.manhours || 0).toFixed(1)}</td>
                <td>${r.created_by || '-'}</td>
            </tr>`;
        });
        html += '</tbody></table>';
        table.innerHTML = html;
    } catch(err) {
        alert('加载失败: ' + err.message);
    }
}

// ============================================================
//  汇总
// ============================================================
async function loadStats() {
    const start = document.getElementById('statsStart').value;
    const end = document.getElementById('statsEnd').value;
    if (!start || !end) { alert('请选择日期范围'); return; }
    
    try {
        const all = await getReports();
        const filtered = all.filter(r => r.date >= start && r.date <= end);
        const container = document.getElementById('statsContent');
        
        if (filtered.length === 0) {
            container.innerHTML = '<p style="color:#999;padding:20px;text-align:center;">📭 暂无数据</p>';
            return;
        }
        
        const totalQty = filtered.reduce((s, r) => s + (r.qty || 0), 0);
        const totalManpower = filtered.reduce((s, r) => s + (r.manpower || 0), 0);
        const totalManhours = filtered.reduce((s, r) => s + (r.manhours || 0), 0);
        
        const areaStats = {};
        filtered.forEach(r => {
            if (!areaStats[r.area]) areaStats[r.area] = { qty: 0, manpower: 0, manhours: 0, count: 0 };
            areaStats[r.area].qty += r.qty || 0;
            areaStats[r.area].manpower += r.manpower || 0;
            areaStats[r.area].manhours += r.manhours || 0;
            areaStats[r.area].count++;
        });
        
        let html = `
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-number">${filtered.length}</div><div class="stat-label">📋 总记录</div></div>
                <div class="stat-card"><div class="stat-number">${totalQty}</div><div class="stat-label">📊 总完成量</div></div>
                <div class="stat-card"><div class="stat-number">${totalManpower}</div><div class="stat-label">👷 总人数</div></div>
                <div class="stat-card"><div class="stat-number">${totalManhours.toFixed(1)}</div><div class="stat-label">⏱️ 总工时</div></div>
            </div>
            <h3>📍 按区域汇总</h3>
            <table><thead><tr><th>区域</th><th>记录数</th><th>完成量</th><th>人数</th><th>工时</th></tr></thead><tbody>`;
        
        Object.keys(areaStats).sort().forEach(area => {
            const s = areaStats[area];
            html += `<tr><td>${area}</td><td>${s.count}</td><td>${s.qty}</td><td>${s.manpower}</td><td>${s.manhours.toFixed(1)}</td></tr>`;
        });
        html += '</tbody></table>';
        container.innerHTML = html;
    } catch(err) {
        alert('汇总失败: ' + err.message);
    }
}

// ============================================================
//  切换Tab
// ============================================================
function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('#tabEntry, #tabView, #tabStats').forEach(el => el.classList.add('hidden'));
    document.querySelector(`.tab-btn[onclick*="${tab}"]`).classList.add('active');
    document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.remove('hidden');
    if (tab === 'view') loadReports();
    if (tab === 'stats') loadStats();
}
</script>

</body>
</html>
